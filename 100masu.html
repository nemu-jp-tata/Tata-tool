<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11152b">
<title>マス計算アーケード</title>
<style>
:root{
  --bg:#101426;--panel:#1b2140;--panel2:#242c50;--line:#39436c;
  --text:#f5f7ff;--muted:#aab4d6;--cyan:#55e7ff;--pink:#ff65b8;
  --yellow:#ffe36e;--green:#55e6a5;--red:#ff7185;--purple:#9c83ff;
  --shadow:0 12px 32px #05081780;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","M PLUS 2",sans-serif;background:radial-gradient(ellipse at 50% -15%,#303b70 0%,transparent 48%),linear-gradient(160deg,#11162d,#0c1020 75%);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,select{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:12px 12px 30px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#101426;font-size:23px;font-weight:1000;box-shadow:0 0 22px #55e7ff55}
.brand h1{font-size:clamp(18px,4vw,25px);margin:0;letter-spacing:.03em;font-weight:950}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;font-weight:800}
.top-actions{display:flex;gap:7px}
.icon-btn{border:1px solid var(--line);background:#202746;color:var(--text);border-radius:12px;min-height:40px;padding:0 11px;font-weight:800}
.icon-btn:active,.btn:active,.key:active{transform:translateY(1px) scale(.98)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px;background:#0b1022;border:1px solid #303a60;border-radius:15px;margin-bottom:12px}
.tab{border:0;border-radius:11px;background:transparent;color:var(--muted);padding:11px 8px;font-weight:900}
.tab.active{color:#101426;background:linear-gradient(100deg,var(--cyan),#9df4ff);box-shadow:0 4px 15px #55e7ff44}
.panel{background:linear-gradient(145deg,#202747,#171d37);border:1px solid #35416a;border-radius:20px;box-shadow:var(--shadow)}
.controls{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:0 0 5px 3px}
select{width:100%;min-height:43px;border-radius:12px;border:1px solid #46527c;background:#111831;color:white;padding:0 10px;font-weight:800}
.btn{border:0;border-radius:13px;min-height:44px;padding:10px 14px;font-weight:950;letter-spacing:.02em;color:#11152b;background:linear-gradient(135deg,var(--yellow),#ffb84d);box-shadow:0 4px 0 #bd7931,0 8px 18px #0003}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#8cafff);box-shadow:0 4px 0 #3978b9,0 8px 18px #0003}
.btn.success{background:linear-gradient(135deg,var(--green),#a0f6b5);box-shadow:0 4px 0 #269c76,0 8px 18px #0003}
.btn.subtle{background:#303b61;color:#eef2ff;box-shadow:0 4px 0 #1b2341}
.control-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat{padding:10px 7px;text-align:center;background:#1a2140;border:1px solid #35416a;border-radius:14px}
.stat b{display:block;font-size:clamp(18px,4vw,24px);line-height:1.15;color:var(--yellow);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);font-weight:800}
.grid-panel{padding:9px;margin-bottom:12px}
.grid-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:1px 2px 9px}
.section-title{font-weight:950;font-size:14px}
.hint{font-size:10px;color:var(--muted)}
.grid-scroll{max-height:min(58vh,650px);overflow:auto;border-radius:12px;border:1px solid #46527c;background:#111831;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#596893 #151c35}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;user-select:none}
#calc-grid{width:100%}
#calc-grid.mode19{width:max-content;min-width:100%}
th,td{padding:0;text-align:center;border-right:1px solid #364166;border-bottom:1px solid #364166}
th{background:#29345b;color:#dffaff;font-weight:950}
th.corner{position:sticky;top:0;left:0;z-index:5;background:#5264a4;color:white}
th.top{position:sticky;top:0;z-index:3}
th.left{position:sticky;left:0;z-index:2}
.cell{display:grid;place-items:center;aspect-ratio:1/1;min-width:0;font-weight:850;font-size:clamp(10px,2.8vw,16px)}
.mode9 .cell{width:100%}
.mode19 .cell{width:39px;height:39px;font-size:12px}
td{background:#18203c;color:#f5f7ff}
td:nth-child(even){background:#1c2544}
td.selected{background:#fff0a6!important;color:#25203a!important;box-shadow:inset 0 0 0 3px #ffc83d;position:relative;z-index:1}
td.correct{background:#174f48!important;color:#9dffd5!important}
td.wrong{background:#5a263b!important;color:#ffd0d8!important}
td.revealed{outline:2px solid var(--green);outline-offset:-3px}
.grid-foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;padding:8px 3px 1px}
.result{display:none;padding:13px;margin-bottom:12px;border:1px solid #4d6e91;background:linear-gradient(120deg,#1b3551,#28264e);border-radius:16px}
.result.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
.result strong{font-size:16px}.result small{display:block;color:var(--muted);margin-top:3px}
.result-score{font-size:24px;font-weight:1000;color:var(--yellow);white-space:nowrap}
.keypad-wrap{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#11142600,#0d1224 16%);pointer-events:none}
.keypad{pointer-events:auto;max-width:520px;margin:auto;padding:11px;background:#202747f5;backdrop-filter:blur(16px);border:1px solid #56638c;border-radius:20px 20px 15px 15px;box-shadow:0 -10px 35px #05081799}
.key-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.equation{font-size:clamp(15px,4vw,20px);font-weight:1000;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key-top-actions{display:flex;gap:6px}
.mini{border:1px solid #536087;background:#303b61;color:#fff;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:900}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.key{min-height:48px;border:1px solid #526087;border-radius:12px;background:linear-gradient(180deg,#f7f8ff,#cbd5f4);color:#17203e;font-size:22px;font-weight:1000;box-shadow:0 3px 0 #8995b8}
.key.delete{background:linear-gradient(180deg,#ffc4d0,#ff829d);color:#521b2a}
.key.next{background:linear-gradient(180deg,#a9f7db,#51dba9);color:#103b35}
.key.clear{background:#39466e;color:#fff;font-size:14px;box-shadow:0 3px 0 #202a4d}
.hidden{display:none!important}
#view-ref{display:none}
.ref-info{padding:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ref-equation{color:var(--yellow);font-weight:1000;font-size:18px}
#ref-grid{width:max-content;min-width:100%}
#ref-grid .cell{width:39px;height:39px;font-size:12px}
#ref-grid td{cursor:pointer}
#ref-grid td.cross{background:#344a73!important}
#ref-grid td.target{background:#ffe36e!important;color:#241e39!important;box-shadow:inset 0 0 0 2px #ffae35;font-weight:1000}
#ref-grid th.hot{background:#0e9cb8!important;color:#fff}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin:10px 3px}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800}
.toggle input{accent-color:var(--cyan);width:16px;height:16px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:50;background:#f7f8ff;color:#17203e;padding:10px 17px;border-radius:99px;font-weight:950;box-shadow:var(--shadow);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.keypad-open{padding-bottom:300px}
@media(min-width:760px){
 .app{padding:20px 22px 35px}
 .controls{grid-template-columns:repeat(4,1fr);align-items:end}
 .control-actions{grid-column:auto;grid-column:span 2}
 .grid-panel{padding:15px}
 .mode19 .cell{width:46px;height:46px;font-size:14px}
 #ref-grid .cell{width:46px;height:46px;font-size:14px}
 .keypad-wrap{position:static;padding:0;background:none;display:none}
 .keypad-wrap.desktop-visible{display:block;pointer-events:auto;margin:12px auto 0}
 body.keypad-open{padding-bottom:0}
}
@media(max-width:420px){
 .app{padding:9px 8px 18px}
 .brand-mark{width:36px;height:36px}
 .icon-btn{padding:0 8px;min-height:36px;font-size:11px}
 .controls{padding:9px;gap:7px}
 .btn{font-size:12px;padding:9px 8px}
 .stats{gap:5px}
 .stat{padding:8px 4px}
 .grid-scroll{max-height:53vh}
 .keypad{padding:9px}
 .key{min-height:44px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="topbar">
  <div class="brand"><div class="brand-mark">＋</div><div><small>ARCADE LEARNING</small><h1>マス計算アーケード</h1></div></div>
  <div class="top-actions"><button class="icon-btn" id="reset-record" type="button">記録リセット</button></div>
 </header>
 <nav class="tabs"><button class="tab active" id="tab-train" type="button">🎮 トレーニング</button><button class="tab" id="tab-ref" type="button">📚 計算一覧表</button></nav>
 <section id="view-train">
  <div class="panel controls">
   <div class="field"><label for="grid-size">マスの数</label><select id="grid-size"><option value="9">9×9 ・ 81マス</option><option value="19">19×19 ・ 361マス</option></select></div>
   <div class="field"><label for="calc-mode">計算の種類</label><select id="calc-mode"><option value="add">＋ たし算</option><option value="sub">－ ひき算</option><option value="mul">× かけ算</option></select></div>
   <div class="control-actions"><button class="btn primary" id="btn-generate" type="button">⟳ 新しい問題</button><button class="btn success" id="btn-check" type="button">✓ 答え合わせ</button></div>
   <div class="toggle-row" style="grid-column:1/-1">
    <label class="toggle"><input id="auto-next" type="checkbox" checked>入力後に次へ</label>
    <label class="toggle"><input id="instant-check" type="checkbox">正解をすぐ判定</label>
   </div>
  </div>
  <div class="stats">
   <div class="stat"><b id="timer">00:00</b><span>TIME</span></div>
   <div class="stat"><b id="progress">0 / 81</b><span>ANSWERED</span></div>
   <div class="stat"><b id="best">--:--</b><span>BEST TIME</span></div>
  </div>
  <div class="result" id="result">
   <div><strong id="result-title">チャレンジ結果</strong><small id="result-sub">もう一度挑戦してみよう！</small></div><div class="result-score" id="result-score">0%</div>
  </div>
  <section class="panel grid-panel">
   <div class="grid-head"><span class="section-title">⚡ 計算フィールド</span><span class="hint" id="grid-hint">マスをタップして回答</span></div>
   <div class="grid-scroll" id="grid-scroll"><table id="calc-grid" class="mode9"></table></div>
   <div class="grid-foot"><span>マスを選択 → 数字を入力</span><span>キーボードにも対応</span></div>
  </section>
 </section>
 <section id="view-ref">
  <div class="panel ref-info"><div><div class="section-title">📚 1〜19 計算一覧表</div><div class="hint">マスをタップすると式を確認できます</div></div><div><select id="ref-mode"><option value="mul">× かけ算</option><option value="add">＋ たし算</option></select><div class="ref-equation" id="ref-equation">式を選択</div></div></div>
  <section class="panel grid-panel"><div class="grid-scroll" id="ref-scroll"><table id="ref-grid"></table></div><p class="note">縦横にスクロールできます。上端と左端の数字はスクロール中も固定されます。同じ数字同士の計算は斜めのマスです。</p></section>
 </section>
</div>
<div class="keypad-wrap" id="keypad-wrap">
 <div class="keypad">
  <div class="key-top"><div><div class="hint">SELECTED QUESTION</div><div class="equation" id="equation">マスを選択してください</div></div><div class="key-top-actions"><button class="mini" id="close-keypad" type="button">閉じる</button></div></div>
  <div class="keys">
   <button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key" data-num="4">4</button><button class="key" data-num="5">5</button>
   <button class="key" data-num="6">6</button><button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key" data-num="0">0</button>
   <button class="key delete" id="delete-key">⌫</button><button class="key clear" id="clear-key" style="grid-column:span 2">消去</button><button class="key next" id="next-key" style="grid-column:span 2">次へ ➜</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const state={size:9,mode:'add',rows:[],cols:[],answers:[],selected:null,inputStarted:false,checked:false,started:false,elapsed:0,timer:null,tab:'train',refSelected:null};
const op={add:'＋',sub:'－',mul:'×'};
const bestKey=(size,mode)=>`arcade_best_${size}_${mode}`;
let toastTimer=null;

function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function expected(r,c){return state.mode==='add'?r+c:state.mode==='sub'?r-c:r*c}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(state.started||state.checked)return;state.started=true;state.timer=setInterval(()=>{state.elapsed++;$('timer').textContent=fmt(state.elapsed)},1000)}
function stopTimer(){clearInterval(state.timer);state.timer=null}
function answeredCount(){return state.answers.flat().filter(v=>v!=='').length}
function updateStats(){$('progress').textContent=`${answeredCount()} / ${state.size*state.size}`;$('timer').textContent=fmt(state.elapsed);const b=localStorage.getItem(bestKey(state.size,state.mode));$('best').textContent=b?fmt(Number(b)):'--:--'}
function init(){
 stopTimer();state.size=Number($('grid-size').value);state.mode=$('calc-mode').value;state.rows=shuffle(Array.from({length:state.size},(_,i)=>i+1));if(state.mode==='sub')state.rows=state.rows.map(n=>n+state.size);state.cols=shuffle(Array.from({length:state.size},(_,i)=>i+1));state.answers=Array.from({length:state.size},()=>Array(state.size).fill(''));state.selected=null;state.checked=false;state.started=false;state.elapsed=0;
 $('result').classList.remove('show');$('grid-scroll').scrollTo(0,0);$('calc-grid').className=state.size===9?'mode9':'mode19';$('grid-hint').textContent=state.size===9?'81マスにチャレンジ！':'361マスにチャレンジ！';renderGrid();hidePad();updateStats();$('equation').textContent='マスを選択してください';
}
function renderGrid(){
 const t=$('calc-grid');t.innerHTML='';const thead=document.createElement('thead'),hr=document.createElement('tr');const corner=document.createElement('th');corner.className='corner';corner.innerHTML=`<div class="cell">${op[state.mode]}</div>`;hr.append(corner);
 state.cols.forEach(n=>{const th=document.createElement('th');th.className='top';th.innerHTML=`<div class="cell">${n}</div>`;hr.append(th)});thead.append(hr);t.append(thead);
 const body=document.createElement('tbody');state.rows.forEach((n,r)=>{const tr=document.createElement('tr'),th=document.createElement('th');th.className='left';th.innerHTML=`<div class="cell">${n}</div>`;tr.append(th);
 state.cols.forEach((m,c)=>{const td=document.createElement('td');td.dataset.r=r;td.dataset.c=c;const d=document.createElement('div');d.className='cell';d.textContent=state.answers[r][c];td.append(d);td.addEventListener('click',()=>select(r,c));tr.append(td)});body.append(tr)});t.append(body);
}
function cell(r,c){return $('calc-grid').querySelector(`td[data-r="${r}"][data-c="${c}"]`)}
function select(r,c){
 if(state.checked)return;
 startTimer();if(state.selected){const old=cell(state.selected.r,state.selected.c);if(old)old.classList.remove('selected')}
 state.selected={r,c};state.inputStarted=false;const td=cell(r,c);td.classList.add('selected');$('equation').textContent=`${state.rows[r]} ${op[state.mode]} ${state.cols[c]} = ${state.answers[r][c]===''?'?':state.answers[r][c]}`;showPad();ensureVisible(td);
}
function ensureVisible(td){
 const box=$('grid-scroll'),b=box.getBoundingClientRect(),r=td.getBoundingClientRect(),head=state.size===19?42:30;
 if(r.left<b.left+head)box.scrollBy({left:r.left-(b.left+head)-4,behavior:'smooth'});else if(r.right>b.right-5)box.scrollBy({left:r.right-b.right+5,behavior:'smooth'});
 if(r.top<b.top+head)box.scrollBy({top:r.top-(b.top+head)-4,behavior:'smooth'});else if(r.bottom>b.bottom-5)box.scrollBy({top:r.bottom-b.bottom+5,behavior:'smooth'});
}
function showPad(){$('keypad-wrap').classList.remove('hidden');document.body.classList.add('keypad-open');if(innerWidth>=760)$('keypad-wrap').classList.add('desktop-visible')}
function hidePad(){$('keypad-wrap').classList.add('hidden');$('keypad-wrap').classList.remove('desktop-visible');document.body.classList.remove('keypad-open');if(state.selected){const td=cell(state.selected.r,state.selected.c);if(td)td.classList.remove('selected')}state.selected=null}
function updateEquation(){if(!state.selected)return;const {r,c}=state.selected;$('equation').textContent=`${state.rows[r]} ${op[state.mode]} ${state.cols[c]} = ${state.answers[r][c]===''?'?':state.answers[r][c]}`}
function moveNext(){
 if(!state.selected){select(0,0);return}let {r,c}=state.selected;c++;if(c>=state.size){c=0;r++}if(r>=state.size){hidePad();toast('最後のマスです。答え合わせをしよう！');return}select(r,c)
}
function enterDigit(d){
 if(!state.selected||state.checked)return;
 const {r,c}=state.selected;
 let v=state.inputStarted?state.answers[r][c]:'';
 v=(v+d).slice(-3);
 state.inputStarted=true;
 state.answers[r][c]=v;
 const td=cell(r,c);
 td.querySelector('.cell').textContent=v;
 td.classList.remove('correct','wrong');
 updateEquation();
 updateStats();
 const target=String(expected(state.rows[r],state.cols[c]));
 if($('instant-check').checked){
  if(Number(v)===Number(target)){td.classList.add('correct');if($('auto-next').checked)setTimeout(moveNext,120)}
  else if(v.length>=target.length){td.classList.add('wrong');}
 }else if($('auto-next').checked&&v.length>=target.length){setTimeout(moveNext,100)}
}
function clearAnswer(){if(!state.selected)return;const {r,c}=state.selected;state.answers[r][c]='';state.inputStarted=true;const td=cell(r,c);td.querySelector('.cell').textContent='';td.classList.remove('correct','wrong');updateEquation();updateStats()}
function check(){
 if(state.checked)return;stopTimer();state.checked=true;hidePad();let good=0,total=state.size*state.size,empty=0;
 state.answers.forEach((row,r)=>row.forEach((v,c)=>{const td=cell(r,c);td.classList.remove('selected','correct','wrong');if(v!==''&&Number(v)===expected(state.rows[r],state.cols[c])){good++;td.classList.add('correct')}else{if(v==='')empty++;td.classList.add('wrong')}}));
 const pct=Math.round(good/total*100);$('result').classList.add('show');$('result-title').textContent=good===total?'PERFECT!! 全問正解！':pct>=80?'すごい！よくできました！':pct>=50?'ナイスチャレンジ！':'もう一度チャレンジ！';$('result-sub').textContent=`${total}問中 ${good}問正解${empty?` ・ 未回答 ${empty}問`:''} ／ タイム ${fmt(state.elapsed)}`;$('result-score').textContent=`${pct}%`;
 if(good===total){const key=bestKey(state.size,state.mode),old=Number(localStorage.getItem(key)||0);if(!old||state.elapsed<old){localStorage.setItem(key,String(state.elapsed));toast('自己ベスト更新！')}}
 else updateStats();window.scrollTo({top:0,behavior:'smooth'});
}
function switchTab(tab){
 state.tab=tab;const train=tab==='train';
 $('view-train').style.display=train?'block':'none';
 $('view-ref').style.display=train?'none':'block';
 $('tab-train').classList.toggle('active',train);
 $('tab-ref').classList.toggle('active',!train);
 if(!train){hidePad();renderRef()}
}
function renderRef(){
 const mode=$('ref-mode').value,t=$('ref-grid');t.innerHTML='';$('ref-equation').textContent='式を選択';state.refSelected=null;
 const thead=document.createElement('thead'),hr=document.createElement('tr'),corner=document.createElement('th');corner.className='corner';corner.innerHTML=`<div class="cell">${mode==='mul'?'×':'＋'}</div>`;hr.append(corner);
 for(let c=1;c<=19;c++){const th=document.createElement('th');th.className='top';th.dataset.ch=c;th.innerHTML=`<div class="cell">${c}</div>`;hr.append(th)}thead.append(hr);t.append(thead);
 const body=document.createElement('tbody');for(let r=1;r<=19;r++){const tr=document.createElement('tr'),th=document.createElement('th');th.className='left';th.dataset.rh=r;th.innerHTML=`<div class="cell">${r}</div>`;tr.append(th);for(let c=1;c<=19;c++){const td=document.createElement('td');td.dataset.r=r;td.dataset.c=c;td.innerHTML=`<div class="cell">${mode==='mul'?r*c:r+c}</div>`;td.addEventListener('click',()=>highlightRef(r,c,mode==='mul'?r*c:r+c,mode));tr.append(td)}body.append(tr)}t.append(body);
}
function highlightRef(r,c,v,mode){
 const t=$('ref-grid');t.querySelectorAll('td').forEach(td=>{td.classList.remove('cross','target');if(Number(td.dataset.r)===r&&Number(td.dataset.c)===c)td.classList.add('target');else if(Number(td.dataset.r)===r||Number(td.dataset.c)===c)td.classList.add('cross')});
 t.querySelectorAll('th').forEach(th=>th.classList.remove('hot'));const rh=t.querySelector(`th[data-rh="${r}"]`),ch=t.querySelector(`th[data-ch="${c}"]`);if(rh)rh.classList.add('hot');if(ch)ch.classList.add('hot');$('ref-equation').textContent=`${r} ${mode==='mul'?'×':'＋'} ${c} = ${v}`;
}
$('btn-generate').addEventListener('click',()=>{init();toast('新しい問題を作成しました')});
$('grid-size').addEventListener('change',init);$('calc-mode').addEventListener('change',init);$('btn-check').addEventListener('click',check);
$('tab-train').addEventListener('click',()=>switchTab('train'));$('tab-ref').addEventListener('click',()=>switchTab('ref'));$('ref-mode').addEventListener('change',renderRef);
document.querySelectorAll('[data-num]').forEach(b=>b.addEventListener('click',()=>enterDigit(b.dataset.num)));
$('delete-key').addEventListener('click',()=>{if(!state.selected)return;const {r,c}=state.selected;state.answers[r][c]=state.answers[r][c].slice(0,-1);state.inputStarted=true;const td=cell(r,c);td.querySelector('.cell').textContent=state.answers[r][c];td.classList.remove('correct','wrong');updateEquation();updateStats()});
$('clear-key').addEventListener('click',clearAnswer);$('next-key').addEventListener('click',moveNext);$('close-keypad').addEventListener('click',hidePad);
$('reset-record').addEventListener('click',()=>{if(confirm('この端末に保存された自己ベスト記録をすべて削除しますか？')){for(const k of Object.keys(localStorage))if(k.startsWith('arcade_best_'))localStorage.removeItem(k);updateStats();toast('記録をリセットしました')}});
document.addEventListener('keydown',e=>{
 if(state.tab!=='train'||!state.selected||state.checked)return;
 if(/^[0-9]$/.test(e.key)){e.preventDefault();enterDigit(e.key)}
 else if(e.key==='Backspace'){e.preventDefault();$('delete-key').click()}
 else if(e.key==='Delete'){e.preventDefault();clearAnswer()}
 else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();moveNext()}
 else if(e.key==='Escape')hidePad();
 else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let {r,c}=state.selected;if(e.key==='ArrowUp')r=Math.max(0,r-1);if(e.key==='ArrowDown')r=Math.min(state.size-1,r+1);if(e.key==='ArrowLeft')c=Math.max(0,c-1);if(e.key==='ArrowRight')c=Math.min(state.size-1,c+1);select(r,c)}
});
window.addEventListener('resize',()=>{if(innerWidth>=760&&state.selected)$('keypad-wrap').classList.add('desktop-visible')});
init();
})();
</script>
</body>
</html>
