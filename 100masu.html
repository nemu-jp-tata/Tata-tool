<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マス計算トレーニング (9×9 / 19×19)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        /* スクロールコンテナ：19x19でも縦横スクロールでヘッダーを固定できるようにする */
        .grid-scroll-wrapper {
            max-height: 68vh;
            overflow: auto;
            position: relative;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
        }
        .calc-grid-table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
        }
        /* 9x9モード時は画面幅にフィットさせつつ正方形を維持 */
        .calc-grid-table.mode-9 {
            width: 100%;
            table-layout: fixed;
        }
        .calc-grid-table.mode-9 .cell-box {
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        /* 19x19モード時はタップしやすい最小正方形サイズ(42px)を確保してスクロール */
        .calc-grid-table.mode-19 .cell-box {
            width: 42px;
            height: 42px;
        }
        @media (min-width: 640px) {
            .calc-grid-table.mode-19 .cell-box {
                width: 46px;
                height: 46px;
            }
        }
        .cell-box {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1行目（上端ヘッダー）の固定 */
        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 20;
        }
        /* 1列目（左端ヘッダー）の固定 */
        .sticky-left {
            position: sticky;
            left: 0;
            z-index: 20;
        }
        /* 左上の演算子セル（最前面に固定） */
        .sticky-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 30;
        }

        .calc-cell {
            transition: background-color 0.12s ease;
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
        }
        .calc-header-top {
            border-right: 1px solid #c7d2fe;
            border-bottom: 2px solid #818cf8;
        }
        .calc-header-left {
            border-right: 2px solid #818cf8;
            border-bottom: 1px solid #c7d2fe;
        }
        .calc-corner {
            border-right: 2px solid #4338ca;
            border-bottom: 2px solid #4338ca;
        }

        .cell-selected {
            background-color: #fef08a !important; /* yellow-200 */
            box-shadow: inset 0 0 0 3px #eab308; /* yellow-500 */
            z-index: 10;
            position: relative;
        }
        .cell-correct {
            background-color: #dcfce7 !important; /* green-100 */
            color: #166534 !important; /* green-800 */
        }
        .cell-incorrect {
            background-color: #fee2e2 !important; /* red-100 */
            color: #991b1b !important; /* red-800 */
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .numpad-enter {
            animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 上部ヘッダー & コントロールパネル -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-3 py-3 sm:px-6">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <!-- タイトルとタイマー -->
                <div class="flex items-center gap-3">
                    <h1 class="text-lg sm:text-xl font-bold text-indigo-600 flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        <span id="app-title">81マス計算 (9×9)</span>
                    </h1>
                    <!-- タイマー表示 -->
                    <div class="bg-slate-100 px-3 py-1 rounded-full text-sm font-semibold text-slate-700 flex items-center gap-1.5 border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span id="timer-display">00:00</span>
                    </div>
                </div>

                <!-- アクションボタン群 -->
                <div class="flex items-center gap-2 flex-wrap">
                    <!-- マス数（サイズ）選択 -->
                    <select id="grid-size" aria-label="マスのサイズ" class="bg-slate-100 border border-slate-300 text-slate-700 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block px-2.5 py-2 font-bold cursor-pointer">
                        <option value="9" selected>9×9 (81マス)</option>
                        <option value="19">19×19 (361マス)</option>
                    </select>

                    <!-- 計算モード選択 -->
                    <select id="calc-mode" aria-label="計算の種類" class="bg-slate-100 border border-slate-300 text-slate-700 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block px-2.5 py-2 font-bold cursor-pointer">
                        <option value="add" selected>＋ たし算</option>
                        <option value="sub">－ ひき算</option>
                        <option value="mul">× かけ算</option>
                    </select>

                    <!-- ランダム生成ボタン -->
                    <button id="btn-generate" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-2 px-3.5 sm:px-4 rounded-xl shadow-sm transition flex items-center gap-1.5 text-sm cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>ランダム生成</span>
                    </button>

                    <!-- チェックボタン -->
                    <button id="btn-check" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-2 px-3.5 sm:px-4 rounded-xl shadow-sm transition flex items-center gap-1.5 text-sm cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>チェック</span>
                    </button>
                </div>
            </div>

            <!-- 結果通知バナー -->
            <div id="result-banner" class="hidden mt-3 p-2.5 rounded-xl bg-indigo-50 border border-indigo-200 flex items-center justify-between text-sm sm:text-base">
                <div class="flex items-center gap-2 font-bold text-indigo-900">
                    <span id="result-icon" class="text-xl">🎉</span>
                    <span id="result-text">81問中 0問正解！</span>
                </div>
                <span id="result-time" class="text-xs sm:text-sm font-semibold text-indigo-700 bg-white px-2.5 py-1 rounded-lg border border-indigo-100"></span>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ：マス計算グリッド -->
    <main class="flex-1 flex flex-col items-center justify-start p-2 sm:p-6 pb-72 sm:pb-80">
        <div id="grid-card" class="w-full max-w-lg bg-white p-2 sm:p-4 rounded-2xl shadow-md border border-slate-200 transition-all">
            <div id="grid-scroll-container" class="grid-scroll-wrapper">
                <table id="calc-grid" class="calc-grid-table mode-9 select-none">
                    <!-- JavaScriptでテーブルを生成 -->
                </table>
            </div>
            <p class="text-xs text-slate-400 text-center mt-3">
                マスをタップして下のテンキー（またはキーボード）で数字を入力してください
            </p>
        </div>
    </main>

    <!-- フローティングテンキー -->
    <div id="numpad-container" class="hidden fixed bottom-0 left-0 right-0 z-50 flex justify-center pointer-events-none p-2 sm:p-4">
        <div class="numpad-enter pointer-events-auto w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_-8px_30px_rgba(0,0,0,0.15)] border border-slate-200 p-3 sm:p-4">
            
            <div class="flex items-center justify-between mb-2.5 pb-2 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">選択中</span>
                    <span id="current-equation" class="text-base sm:text-lg font-bold text-indigo-600 bg-indigo-50 px-3 py-0.5 rounded-lg">
                        - ＋ - = ?
                    </span>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="btn-next-cell" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg transition cursor-pointer flex items-center gap-1">
                        <span>次へ</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    <button id="btn-close-numpad" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg transition cursor-pointer">
                        閉じる
                    </button>
                </div>
            </div>

            <!-- 0〜9 数字ボタン -->
            <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
                <button type="button" data-num="1" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">1</button>
                <button type="button" data-num="2" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">2</button>
                <button type="button" data-num="3" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">3</button>
                <button type="button" data-num="4" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">4</button>
                <button type="button" data-num="5" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">5</button>
                
                <button type="button" data-num="6" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">6</button>
                <button type="button" data-num="7" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">7</button>
                <button type="button" data-num="8" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">8</button>
                <button type="button" data-num="9" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">9</button>
                <button type="button" data-num="0" class="num-btn bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white text-slate-800 font-bold text-xl sm:text-2xl py-3 sm:py-3.5 rounded-xl border border-slate-200 shadow-sm transition cursor-pointer">0</button>
            </div>

            <div class="mt-2">
                <button type="button" id="btn-clear" class="w-full bg-rose-50 hover:bg-rose-100 active:bg-rose-200 text-rose-700 font-bold text-sm sm:text-base py-2.5 rounded-xl border border-rose-200 transition flex items-center justify-center gap-1.5 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                    <span>消去（クリア）</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let gridSize = 9; // 9 or 19
            let colNumbers = [];
            let rowNumbers = [];
            let userAnswers = [];
            let selectedCell = null;
            let calcMode = 'add';
            let isChecked = false;

            let timerInterval = null;
            let elapsedSeconds = 0;
            let isTimerRunning = false;

            const appTitle = document.getElementById('app-title');
            const gridCard = document.getElementById('grid-card');
            const gridScrollContainer = document.getElementById('grid-scroll-container');
            const gridTable = document.getElementById('calc-grid');
            const sizeSelect = document.getElementById('grid-size');
            const modeSelect = document.getElementById('calc-mode');
            const btnGenerate = document.getElementById('btn-generate');
            const btnCheck = document.getElementById('btn-check');
            const timerDisplay = document.getElementById('timer-display');
            const resultBanner = document.getElementById('result-banner');
            const resultIcon = document.getElementById('result-icon');
            const resultText = document.getElementById('result-text');
            const resultTime = document.getElementById('result-time');

            const numpadContainer = document.getElementById('numpad-container');
            const currentEquation = document.getElementById('current-equation');
            const btnNextCell = document.getElementById('btn-next-cell');
            const btnCloseNumpad = document.getElementById('btn-close-numpad');
            const btnClear = document.getElementById('btn-clear');
            const numButtons = document.querySelectorAll('.num-btn');

            /**
             * 1〜size の重複なしランダム配列を生成
             */
            function generateShuffledDigits(size) {
                const digits = Array.from({ length: size }, (_, i) => i + 1);
                for (let i = digits.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [digits[i], digits[j]] = [digits[j], digits[i]];
                }
                return digits;
            }

            /**
             * ひき算時は答えが負にならないよう左端の数値を +size する
             */
            function generateRowDigits(size, mode) {
                const base = generateShuffledDigits(size);
                if (mode === 'sub') {
                    return base.map(n => n + size);
                }
                return base;
            }

            function getOperatorSymbol(mode) {
                switch (mode) {
                    case 'add': return '＋';
                    case 'sub': return '－';
                    case 'mul': return '×';
                    default: return '＋';
                }
            }

            function calculateExpected(rowVal, colVal, mode) {
                switch (mode) {
                    case 'add': return rowVal + colVal;
                    case 'sub': return rowVal - colVal;
                    case 'mul': return rowVal * colVal;
                    default: return rowVal + colVal;
                }
            }

            function startTimer() {
                if (isTimerRunning) return;
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    elapsedSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }

            function stopTimer() {
                isTimerRunning = false;
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function resetTimer() {
                stopTimer();
                elapsedSeconds = 0;
                updateTimerDisplay();
            }

            function formatTime(sec) {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            }

            function updateTimerDisplay() {
                timerDisplay.textContent = formatTime(elapsedSeconds);
            }

            function initGame() {
                gridSize = parseInt(sizeSelect.value, 10);
                calcMode = modeSelect.value;

                // タイトルとカード幅の調整
                const totalQuestions = gridSize * gridSize;
                appTitle.textContent = `${totalQuestions}マス計算 (${gridSize}×${gridSize})`;
                if (gridSize === 19) {
                    gridCard.classList.remove('max-w-lg');
                    gridCard.classList.add('max-w-4xl');
                    gridTable.classList.remove('mode-9');
                    gridTable.classList.add('mode-19');
                } else {
                    gridCard.classList.remove('max-w-4xl');
                    gridCard.classList.add('max-w-lg');
                    gridTable.classList.remove('mode-19');
                    gridTable.classList.add('mode-9');
                }

                colNumbers = generateShuffledDigits(gridSize);
                rowNumbers = generateRowDigits(gridSize, calcMode);
                userAnswers = Array.from({ length: gridSize }, () => Array(gridSize).fill(''));
                selectedCell = null;
                isChecked = false;

                resultBanner.classList.add('hidden');
                hideNumpad();
                resetTimer();
                gridScrollContainer.scrollTo(0, 0);

                renderGrid();
            }

            /**
             * 1行目・1列目固定対応の正方形テーブルを構築
             */
            function renderGrid() {
                gridTable.innerHTML = '';
                const opSymbol = getOperatorSymbol(calcMode);

                // 1. ヘッダー行 (1行目：sticky-top)
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');

                // 左上の演算子セル (sticky-corner)
                const cornerTh = document.createElement('th');
                cornerTh.className = 'sticky-corner calc-corner bg-indigo-600 text-white font-bold text-sm sm:text-lg p-0 select-none';
                cornerTh.innerHTML = `<div class="cell-box">${opSymbol}</div>`;
                headerRow.appendChild(cornerTh);

                // 上端の数字セル (sticky-top)
                colNumbers.forEach((num) => {
                    const th = document.createElement('th');
                    th.className = 'sticky-top calc-header-top bg-indigo-100 text-indigo-900 font-bold text-xs sm:text-base p-0';
                    th.innerHTML = `<div class="cell-box">${num}</div>`;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                gridTable.appendChild(thead);

                // 2. データ行
                const tbody = document.createElement('tbody');
                rowNumbers.forEach((rowNum, rIdx) => {
                    const tr = document.createElement('tr');

                    // 左端ヘッダーセル (sticky-left)
                    const rowTh = document.createElement('th');
                    rowTh.className = 'sticky-left calc-header-left bg-indigo-100 text-indigo-900 font-bold text-xs sm:text-base p-0';
                    rowTh.innerHTML = `<div class="cell-box">${rowNum}</div>`;
                    tr.appendChild(rowTh);

                    // 回答マス
                    for (let cIdx = 0; cIdx < gridSize; cIdx++) {
                        const td = document.createElement('td');
                        td.dataset.row = rIdx;
                        td.dataset.col = cIdx;
                        td.className = 'calc-cell text-center font-bold text-xs sm:text-base bg-white cursor-pointer hover:bg-slate-50 p-0';
                        
                        const div = document.createElement('div');
                        div.className = 'cell-box';
                        div.textContent = userAnswers[rIdx][cIdx];
                        td.appendChild(div);

                        td.addEventListener('click', () => {
                            selectCell(rIdx, cIdx);
                        });

                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                });
                gridTable.appendChild(tbody);
            }

            function selectCell(row, col) {
                if (!isChecked && !isTimerRunning) {
                    startTimer();
                }

                if (selectedCell) {
                    const prevTd = getCellElement(selectedCell.row, selectedCell.col);
                    if (prevTd) prevTd.classList.remove('cell-selected');
                }

                selectedCell = { row, col };
                const currentTd = getCellElement(row, col);
                if (currentTd) {
                    currentTd.classList.add('cell-selected');
                    ensureCellVisible(currentTd);
                }

                updateEquationDisplay();
                showNumpad();
            }

            /**
             * スクロールコンテナ内および画面全体で選択セルが見切れないよう調整
             */
            function ensureCellVisible(cellEl) {
                // スクロールコンテナ内での自動スクロール（固定ヘッダー分の余白を考慮）
                const containerRect = gridScrollContainer.getBoundingClientRect();
                const cellRect = cellEl.getBoundingClientRect();
                const headerOffset = cellEl.offsetWidth + 8;

                if (cellRect.left < containerRect.left + headerOffset) {
                    gridScrollContainer.scrollBy({
                        left: cellRect.left - (containerRect.left + headerOffset),
                        behavior: 'smooth'
                    });
                } else if (cellRect.right > containerRect.right - 8) {
                    gridScrollContainer.scrollBy({
                        left: cellRect.right - containerRect.right + 8,
                        behavior: 'smooth'
                    });
                }

                if (cellRect.top < containerRect.top + headerOffset) {
                    gridScrollContainer.scrollBy({
                        top: cellRect.top - (containerRect.top + headerOffset),
                        behavior: 'smooth'
                    });
                } else if (cellRect.bottom > containerRect.bottom - 8) {
                    gridScrollContainer.scrollBy({
                        top: cellRect.bottom - containerRect.bottom + 8,
                        behavior: 'smooth'
                    });
                }

                // 画面下部のフローティングテンキーに隠れないようにウィンドウをスクロール
                const updatedRect = cellEl.getBoundingClientRect();
                const numpadHeight = 270;
                const viewportHeight = window.innerHeight;
                if (updatedRect.bottom > viewportHeight - numpadHeight) {
                    window.scrollBy({
                        top: updatedRect.bottom - (viewportHeight - numpadHeight) + 20,
                        behavior: 'smooth'
                    });
                }
            }

            function getCellElement(row, col) {
                return gridTable.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
            }

            function showNumpad() {
                numpadContainer.classList.remove('hidden');
            }

            function hideNumpad() {
                numpadContainer.classList.add('hidden');
                if (selectedCell) {
                    const prevTd = getCellElement(selectedCell.row, selectedCell.col);
                    if (prevTd) prevTd.classList.remove('cell-selected');
                    selectedCell = null;
                }
            }

            function updateEquationDisplay() {
                if (!selectedCell) return;
                const { row, col } = selectedCell;
                const rVal = rowNumbers[row];
                const cVal = colNumbers[col];
                const op = getOperatorSymbol(calcMode);
                const ans = userAnswers[row][col] === '' ? '?' : userAnswers[row][col];
                currentEquation.textContent = `${rVal} ${op} ${cVal} = ${ans}`;
            }

            function inputDigit(digitStr) {
                if (!selectedCell) return;
                const { row, col } = selectedCell;

                const td = getCellElement(row, col);
                if (td) {
                    td.classList.remove('cell-correct', 'cell-incorrect');
                }

                let currentVal = userAnswers[row][col];
                if (currentVal === '0') {
                    currentVal = digitStr;
                } else if (currentVal.length < 3) {
                    currentVal += digitStr;
                } else {
                    currentVal = digitStr;
                }

                userAnswers[row][col] = currentVal;
                const div = td.querySelector('.cell-box');
                if (div) div.textContent = currentVal;
                updateEquationDisplay();
            }

            function clearCurrentCell() {
                if (!selectedCell) return;
                const { row, col } = selectedCell;
                userAnswers[row][col] = '';
                const td = getCellElement(row, col);
                if (td) {
                    const div = td.querySelector('.cell-box');
                    if (div) div.textContent = '';
                    td.classList.remove('cell-correct', 'cell-incorrect');
                }
                updateEquationDisplay();
            }

            function moveToNextCell() {
                if (!selectedCell) {
                    selectCell(0, 0);
                    return;
                }
                let { row, col } = selectedCell;
                col++;
                if (col >= gridSize) {
                    col = 0;
                    row++;
                }
                if (row >= gridSize) {
                    hideNumpad();
                    return;
                }
                selectCell(row, col);
            }

            function checkAnswers() {
                stopTimer();
                hideNumpad();
                isChecked = true;

                let correctCount = 0;
                const totalCells = gridSize * gridSize;

                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        const td = getCellElement(r, c);
                        if (!td) continue;

                        td.classList.remove('cell-correct', 'cell-incorrect', 'cell-selected');

                        const expected = calculateExpected(rowNumbers[r], colNumbers[c], calcMode);
                        const rawInput = userAnswers[r][c];
                        const parsedInput = rawInput === '' ? NaN : parseInt(rawInput, 10);

                        if (!isNaN(parsedInput) && parsedInput === expected) {
                            correctCount++;
                            td.classList.add('cell-correct');
                        } else {
                            td.classList.add('cell-incorrect');
                        }
                    }
                }

                resultBanner.classList.remove('hidden');
                resultTime.textContent = `タイム: ${formatTime(elapsedSeconds)}`;

                if (correctCount === totalCells) {
                    resultIcon.textContent = '🏆';
                    resultText.textContent = `パーフェクト！ ${totalCells}問中 ${totalCells}問正解！`;
                    resultBanner.className = 'mt-3 p-2.5 rounded-xl bg-emerald-50 border border-emerald-300 flex items-center justify-between text-sm sm:text-base';
                    resultText.className = 'font-bold text-emerald-900';
                } else {
                    const ratio = correctCount / totalCells;
                    resultIcon.textContent = ratio >= 0.85 ? '👏' : '📝';
                    resultText.textContent = `${totalCells}問中 ${correctCount}問正解！`;
                    resultBanner.className = 'mt-3 p-2.5 rounded-xl bg-indigo-50 border border-indigo-200 flex items-center justify-between text-sm sm:text-base';
                    resultText.className = 'font-bold text-indigo-900';
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            btnGenerate.addEventListener('click', initGame);
            sizeSelect.addEventListener('change', initGame);
            modeSelect.addEventListener('change', initGame);
            btnCheck.addEventListener('click', checkAnswers);

            numButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const num = btn.dataset.num;
                    inputDigit(num);
                });
            });

            btnClear.addEventListener('click', (e) => {
                e.stopPropagation();
                clearCurrentCell();
            });

            btnNextCell.addEventListener('click', (e) => {
                e.stopPropagation();
                moveToNextCell();
            });

            btnCloseNumpad.addEventListener('click', (e) => {
                e.stopPropagation();
                hideNumpad();
            });

            document.addEventListener('keydown', (e) => {
                if (!selectedCell) return;

                if (e.key >= '0' && e.key <= '9') {
                    e.preventDefault();
                    inputDigit(e.key);
                } else if (e.key === 'Backspace' || e.key === 'Delete') {
                    e.preventDefault();
                    clearCurrentCell();
                } else if (e.key === 'Enter' || e.key === 'Tab') {
                    e.preventDefault();
                    moveToNextCell();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    hideNumpad();
                } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                    let { row, col } = selectedCell;
                    if (e.key === 'ArrowUp' && row > 0) row--;
                    if (e.key === 'ArrowDown' && row < gridSize - 1) row++;
                    if (e.key === 'ArrowLeft' && col > 0) col--;
                    if (e.key === 'ArrowRight' && col < gridSize - 1) col++;
                    selectCell(row, col);
                }
            });

            initGame();
        });
    </script>
</body>
</html>
