<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タタ手持ち育成診断</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; padding: 15px; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; text-align: center; color: #1e293b; font-size: 20px; }
    
    .step-panel { display: none; }
    .step-panel.active { display: block; }

    .section-title { font-weight: bold; color: #334155; margin-bottom: 8px; font-size: 15px; border-left: 4px solid #2563eb; padding-left: 8px; }
    .sub-text { font-size: 12px; color: #64748b; margin-bottom: 12px; }
    
    .radio-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .radio-label { flex: 1; text-align: center; padding: 12px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; color: #475569; }
    .radio-label input { display: none; }
    .radio-label:has(input:checked) { border-color: #2563eb; background: #eff6ff; color: #2563eb; }

    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
    .monster-item { position: relative; border: 2px solid transparent; border-radius: 8px; overflow: hidden; cursor: pointer; background: #e2e8f0; aspect-ratio: 1; }
    .monster-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .monster-item.selected { border-color: #2563eb; box-shadow: 0 0 0 2px #2563eb; }
    .monster-item.selected::after { content: "✓"; position: absolute; top: 2px; right: 2px; background: #2563eb; color: #fff; font-size: 10px; font-weight: bold; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .monster-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 9px; text-align: center; padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 14px; background: #2563eb; color: #fff; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; text-align: center; }
    .btn:hover { background: #1d4ed8; }
    .btn-sub { background: #94a3b8; }
    .btn-sub:hover { background: #64748b; }
    
    #diag-output { padding: 16px; background: #eff6ff; border-radius: 10px; border: 2px solid #3b82f6; }
    
    .rec-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-top: 10px; display: flex; align-items: center; gap: 12px; }
    .rec-card img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔰 次に育てるタタ診断</h2>

  <!-- STEP 1 -->
  <div id="step-1" class="step-panel active">
    <div class="section-title">Q1. 今の攻略状況は？</div>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="progress" value="early" checked>
        序盤攻略中<br><span style="font-size:11px; font-weight:normal; color:#64748b;">(まずは土台作り)</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="progress" value="mid">
        中盤で詰まり気味<br><span style="font-size:11px; font-weight:normal; color:#64748b;">(敵の攻撃が痛い)</span>
      </label>
    </div>
    <button class="btn" onclick="nextStep(2)">次へ進む ➔</button>
  </div>

  <!-- STEP 2 -->
  <div id="step-2" class="step-panel">
    <div class="section-title">Q2. 手持ちで「T2（第2進化）以上」まで育てているタタを選んでください</div>
    <div class="sub-text">※現在パーティで使っている・育成済みのタタをタップ（複数選択可）</div>
    <div id="monster-grid" class="grid-container"></div>

    <div class="btn-group">
      <button class="btn btn-sub" onclick="nextStep(1)">← 戻る</button>
      <button class="btn" onclick="diagnose()">診断結果を見る！</button>
    </div>
  </div>

  <!-- STEP 3 (診断結果) -->
  <div id="step-3" class="step-panel">
    <div id="diag-output"></div>
    <div class="btn-group" style="margin-top: 20px;">
      <button class="btn btn-sub" onclick="nextStep(2)">← 選択をやり直す</button>
    </div>
  </div>
</div>

<script src="monsters.js"></script>
<script>
const selectedMonsters = new Set();

// サポート枠だが壁になれる特例タタ
const specialSupportTankNames = ['ガオデン', 'ホネギョ', 'ガオ', 'ホネ']; 

// 裏側で壁役（前衛適性）かどうかを判定する関数
function isTankRole(monster) {
  if (!monster) return false;
  const role = monster.role || '';
  if (role === 'タンク' || role === '壁' || role === 'ファイター') return true;
  if (specialSupportTankNames.some(name => monster.name.includes(name) || monster.species.includes(name))) return true;
  return false;
}

function nextStep(stepNum) {
  document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
  document.getElementById(`step-${stepNum}`).classList.add('active');
}

window.addEventListener('DOMContentLoaded', () => {
  if (typeof rawMonstersData === 'undefined') return;

  const grid = document.getElementById('monster-grid');

  // T3以上が存在する「種族」を抽出
  const validSpecies = new Set(
    rawMonstersData.filter(m => m.T >= 3).map(m => m.species)
  );

  // 種族ごとのベース（T1形態）を取得
  const targetT1Monsters = [];
  validSpecies.forEach(sp => {
    const speciesForms = rawMonstersData.filter(m => m.species === sp);
    const baseForm = speciesForms.reduce((prev, curr) => (prev.T < curr.T ? prev : curr));
    targetT1Monsters.push(baseForm);
  });

  // グリッド生成（壁役適性のあるタタ一覧）
  const tankMonsters = targetT1Monsters.filter(m => isTankRole(m));

  tankMonsters.forEach(m => {
    const item = document.createElement('div');
    item.className = 'monster-item';
    item.dataset.name = m.name;
    
    item.innerHTML = `
      <img src="./${encodeURIComponent(m.name)}.webp" alt="${m.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/60?text=${encodeURIComponent(m.name)}';">
      <div class="monster-name">${m.name}</div>
    `;

    item.addEventListener('click', () => {
      if (selectedMonsters.has(m.name)) {
        selectedMonsters.delete(m.name);
        item.classList.remove('selected');
      } else {
        selectedMonsters.add(m.name);
        item.classList.add('selected');
      }
    });

    grid.appendChild(item);
  });
});

function diagnose() {
  const userList = Array.from(selectedMonsters);
  const myTanks = rawMonstersData.filter(m => userList.includes(m.name));
  
  const allAttrs = ['炎', '水', '草', '雷', '岩'];
  const tankAttrs = new Set(myTanks.map(m => m.type));
  
  // T2壁役が足りていない属性
  const missingTankAttrs = allAttrs.filter(a => !tankAttrs.has(a));

  let outputHTML = "";

  if (missingTankAttrs.length > 0) {
    // 全データから、T3以上に育つ壁役（T1ベース形態）を取得
    const validSpecies = new Set(rawMonstersData.filter(m => m.T >= 3).map(m => m.species));
    const allTankT1 = [];
    validSpecies.forEach(sp => {
      const speciesForms = rawMonstersData.filter(m => m.species === sp);
      const baseForm = speciesForms.reduce((prev, curr) => (prev.T < curr.T ? prev : curr));
      if (isTankRole(baseForm)) {
        allTankT1.push(baseForm);
      }
    });

    // 不足属性ごとに候補となる壁タタを1体ずつピックアップ
    let candidateCardsHTML = "";
    missingTankAttrs.forEach(attr => {
      const candidate = allTankT1.find(m => m.type === attr);
      if (candidate) {
        candidateCardsHTML += `
          <div class="rec-card">
            <img src="./${encodeURIComponent(candidate.name)}.webp" alt="${candidate.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=${encodeURIComponent(candidate.name)}';">
            <div>
              <div style="font-size:11px; color:#2563eb; font-weight:bold;">【${attr}属性】のおすすめ壁役</div>
              <div style="font-size:14px; font-weight:bold; color:#1e293b;">${candidate.name}</div>
            </div>
          </div>
        `;
      }
    });

    outputHTML = `
      <div style="text-align:center;">
        <span style="background:#dc2626; color:#fff; font-size:12px; font-weight:bold; padding:4px 8px; border-radius:4px;">診断結果</span>
        <h3 style="margin:10px 0 5px 0; color:#1e293b; font-size:18px;">「壁役（前衛）」の補強が必要です！</h3>
      </div>
      <div style="font-size:13px; color:#334155; line-height:1.6; background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1; margin-top:10px;">
        現在、<b style="color:#dc2626;">[ ${missingTankAttrs.join('・')} ]</b> 属性で頼れる前衛・壁役が不足しています。<br>
        アタッカーが倒されて攻略が止まるのを防ぐため、<b>最低でもこの中から1体育成しましょう！</b>
      </div>
      <div style="margin-top:10px;">
        ${candidateCardsHTML}
      </div>
    `;
  } else {
    outputHTML = `
      <div style="text-align:center;">
        <span style="background:#16a34a; color:#fff; font-size:12px; font-weight:bold; padding:4px 8px; border-radius:4px;">診断結果</span>
        <h3 style="margin:10px 0 5px 0; color:#1e293b; font-size:18px;">前衛の土台はバッチリです！</h3>
      </div>
      <div style="font-size:13px; color:#334155; line-height:1.6; background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1; margin-top:10px;">
        全属性でしっかり前衛（壁役）になれるタタが育っています！<br><br>
        次はこれらのタタを<b>T3/T4へ最終進化</b>させるか、主力アタッカー・ヒーラーの育成にシフトしていきましょう。
      </div>
    `;
  }

  const output = document.getElementById('diag-output');
  output.innerHTML = outputHTML;
  
  nextStep(3);
}
</script>
</body>
</html>
