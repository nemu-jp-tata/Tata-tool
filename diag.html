<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タタ手持ち育成診断</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; padding: 20px; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #cbd5e1; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #1e293b; }
    select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .checkbox-label { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    #diag-output { display: none; margin-top: 20px; padding: 15px; background: #eff6ff; border-radius: 8px; border: 2px solid #3b82f6; }
  </style>
</head>
<body>

<div class="card">
  <h2 style="margin-top:0; text-align:center; color:#1e293b;">🔰 初心者向け タタ手持ち育成診断</h2>
  
  <div class="form-group">
    <label>Q1. 手持ちで一番多い進化段階は？（ノーマル除く）</label>
    <select id="user-tier">
      <option value="1">未進化 (T1)</option>
      <option value="2">第2進化 (T2)</option>
      <option value="3">第3進化 (T3)</option>
      <option value="4">第4進化 (T4)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Q2. 育成済み・主力の「T3〜T4タタ」がいる属性を選んでください</label>
    <div class="checkbox-group">
      <label class="checkbox-label" style="background:#ffe6e6;"><input type="checkbox" class="user-attr" value="炎"> 炎属性</label>
      <label class="checkbox-label" style="background:#e6f2ff;"><input type="checkbox" class="user-attr" value="水"> 水属性</label>
      <label class="checkbox-label" style="background:#e6ffe6;"><input type="checkbox" class="user-attr" value="草"> 草属性</label>
      <label class="checkbox-label" style="background:#ffffd9;"><input type="checkbox" class="user-attr" value="雷"> 雷属性</label>
      <label class="checkbox-label" style="background:#f5f0e6;"><input type="checkbox" class="user-attr" value="岩"> 岩属性</label>
    </div>
  </div>

  <button class="btn" onclick="diagnose()">診断する</button>

  <div id="diag-output"></div>
</div>

<!-- 同階層の monsters.js を読み込む -->
<script src="monsters.js"></script>
<script>
function diagnose() {
  if (typeof rawMonstersData === 'undefined') {
    alert("データが読み込めませんでした。");
    return;
  }

  const tier = parseInt(document.getElementById('user-tier').value, 10);
  const checkedAttrs = Array.from(document.querySelectorAll('.user-attr:checked')).map(cb => cb.value);
  const missingAttrs = ['炎', '水', '草', '雷', '岩'].filter(a => !checkedAttrs.includes(a));

  const allMonsters = rawMonstersData.map(m => ({
    name: m.name, species: m.species, attr: m.type, tierNum: m.T, role: m.role
  }));

  const baseMonstersMap = new Map();
  allMonsters.forEach(m => {
    if (!baseMonstersMap.has(m.species) || m.tierNum < baseMonstersMap.get(m.species).tierNum) {
      baseMonstersMap.set(m.species, m);
    }
  });

  let recommendHTML = "";
  if (missingAttrs.length > 0) {
    const targetAttr = missingAttrs[Math.floor(Math.random() * missingAttrs.length)];
    const candidates = allMonsters.filter(m => m.attr === targetAttr && m.tierNum >= 3);
    
    if (candidates.length > 0) {
      const targetMonster = candidates[Math.floor(Math.random() * candidates.length)];
      const baseMonster = baseMonstersMap.get(targetMonster.species) || targetMonster;

      recommendHTML = `
        <div style="margin-top:15px; background:#fff; padding:12px; border-radius:6px; border:1px solid #cbd5e1; display:flex; align-items:center; gap:12px;">
          <img src="./${encodeURIComponent(baseMonster.name)}.webp" width="60" height="60" style="border-radius:6px; object-fit:cover; background:#e2e8f0; flex-shrink:0;" alt="${baseMonster.name}" onerror="this.style.display='none'">
          <div>
            <div style="font-size:12px; color:#2563eb; font-weight:bold;">【おすすめ補強タタ】</div>
            <strong style="font-size:16px; color:#1e293b;">${baseMonster.name} （${baseMonster.attr}属性）</strong>
            <div style="font-size:12px; color:#475569; margin-top:4px;">
              ${targetAttr}属性の戦力を補うため、まずは <b>${baseMonster.name}</b> を育成して <b>${targetMonster.name}（T${targetMonster.tierNum}）</b> を目指すのがおすすめです！
            </div>
          </div>
        </div>
      `;
    }
  }

  const output = document.getElementById('diag-output');
  output.style.display = 'block';
  output.innerHTML = `
    <h3 style="margin-top:0; color:#1e3a8a; font-size:18px;">診断結果（主力目標：T${tier}段階）</h3>
    <p style="margin-bottom:8px; color:#334155;"><b>■ 属性バランス評価:</b><br>
    ${checkedAttrs.length === 5 
      ? '<span style="color:#16a34a; font-weight:bold;">全属性バランス良く揃っています！</span>' 
      : `<span style="color:#dc2626; font-weight:bold;">[ ${missingAttrs.join('・')} ]</span> 属性の主力が不足しています。`}
    </p>
    ${recommendHTML}
  `;
}
</script>
</body>
</html>
