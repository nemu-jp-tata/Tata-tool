<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスター配置ツール</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121420;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .btn {
      background: #282d42;
      color: #e2e8f0;
      border: 1px solid #3b4261;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:active {
      background: #3b4261;
    }

    /* 6x6 グリッド */
    .board-frame {
      background: #181a29;
      border: 1px solid #282d42;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
    }
    .grid-6x6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .cell {
      background: #0f111a;
      border: 1px dashed #282d45;
      border-radius: 6px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      padding: 2px;
    }
    .cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* モンスター選択エリア */
    .monster-frame {
      background: #181a29;
      border: 1px solid #282d42;
      border-radius: 12px;
      padding: 10px;
    }
    .monster-title {
      font-size: 13px;
      font-weight: bold;
      color: #e2e8f0;
      margin-bottom: 8px;
      text-align: center;
    }

    /* アコーディオン（フィルター部分） */
    .filter-details {
      background: #0f111a;
      border: 1px solid #282d45;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .filter-summary {
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filter-summary::-webkit-details-marker {
      display: none;
    }
    .filter-details[open] .summary-arrow {
      transform: rotate(180deg);
    }
    .summary-arrow {
      transition: transform 0.2s;
    }

    /* フィルターエリア */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid #282d45;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      justify-content: center;
    }
    .filter-label {
      font-size: 10px;
      color: #64748b;
      margin-right: 2px;
    }
    .filter-btn {
      background: #181a29;
      color: #94a3b8;
      border: 1px solid #282d45;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-btn img {
      width: 14px;
      height: 14px;
      object-fit: contain;
    }
    .filter-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* モンスター一覧 */
    .monster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .monster-item {
      background: #0f111a;
      border: 1px solid #282d45;
      border-radius: 8px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
    }
    .monster-item.active {
      border: 2px solid #4ade80;
      background: #1e293b;
    }
    .monster-item img {
      width: 75%;
      height: 75%;
      object-fit: contain;
    }
    .monster-name {
      font-size: 9px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.1;
      word-break: break-all;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-tools">
    <span style="font-size: 12px; color: #94a3b8;">選択中: <strong id="selectedName" style="color:#4ade80;">なし</strong></span>
    <button class="btn" id="clearBtn">盤面クリア</button>
  </div>

  <!-- 6x6 盤面 -->
  <div class="board-frame">
    <div class="grid-6x6" id="mainGrid"></div>
  </div>

  <!-- モンスター選択エリア -->
  <div class="monster-frame">
    <div class="monster-title">モンスター選択</div>

    <!-- アコーディオン（絞り込みフィルター） -->
    <details class="filter-details">
      <summary class="filter-summary">
        <span>絞り込みフィルターを開く</span>
        <span class="summary-arrow">▼</span>
      </summary>
      
      <div class="filter-section">
        <!-- 1. 属性フィルター -->
        <div class="filter-row" id="attrFilterGroup">
          <span class="filter-label">属性:</span>
          <button class="filter-btn active" data-attr="all">すべて</button>
          <button class="filter-btn" data-attr="水"><img src="水属性.webp" alt="水" onerror="this.style.display='none'">水</button>
          <button class="filter-btn" data-attr="炎"><img src="炎属性.webp" alt="炎" onerror="this.style.display='none'">炎</button>
          <button class="filter-btn" data-attr="草"><img src="草属性.webp" alt="草" onerror="this.style.display='none'">草</button>
          <button class="filter-btn" data-attr="岩"><img src="岩属性.webp" alt="岩" onerror="this.style.display='none'">岩</button>
          <button class="filter-btn" data-attr="雷"><img src="雷属性.webp" alt="雷" onerror="this.style.display='none'">雷</button>
        </div>

        <!-- 2. Tier フィルター -->
        <div class="filter-row" id="tierFilterGroup">
          <span class="filter-label">Tier:</span>
          <button class="filter-btn active" data-tier="all">すべて</button>
          <button class="filter-btn" data-tier="T1">T1</button>
          <button class="filter-btn" data-tier="T2">T2</button>
          <button class="filter-btn" data-tier="T3">T3</button>
          <button class="filter-btn" data-tier="T4">T4</button>
        </div>

        <!-- 3. タイプ フィルター -->
        <div class="filter-row" id="typeFilterGroup">
          <span class="filter-label">タイプ:</span>
          <button class="filter-btn active" data-type="all">すべて</button>
          <button class="filter-btn" data-type="タンク"><img src="タンク.webp" alt="タンク" onerror="this.style.display='none'">タンク</button>
          <button class="filter-btn" data-type="ファイター"><img src="ファイター.webp" alt="ファイター" onerror="this.style.display='none'">ファイター</button>
          <button class="filter-btn" data-type="ダメージ"><img src="ダメージ.webp" alt="ダメージ" onerror="this.style.display='none'">ダメージ</button>
          <button class="filter-btn" data-type="ヒール"><img src="ヒール.webp" alt="ヒール" onerror="this.style.display='none'">ヒール</button>
          <button class="filter-btn" data-type="サポート"><img src="サポート.webp" alt="サポート" onerror="this.style.display='none'">サポート</button>
          <button class="filter-btn" data-type="スペシャル"><img src="スペシャル.webp" alt="スペシャル" onerror="this.style.display='none'">スペシャル</button>
        </div>
      </div>
    </details>

    <!-- モンスター一覧 -->
    <div class="monster-grid" id="monsterGrid"></div>
  </div>
</div>

<!-- 外部のデータファイルを読み込む -->
<script src="monsters.js"></script>

<script>
  // 自動でHTML表示用フォーマットに変換
  const monstersData = rawMonstersData.map(m => ({
    name: m.name,
    attr: m.type,
    tier: "T" + m.T,
    type: m.role
  }));

  let currentSelected = null;

  // 現在の絞り込み状態
  let currentAttr = "all";
  let currentTier = "all";
  let currentType = "all";

  // 6x6盤面生成
  const mainGrid = document.getElementById('mainGrid');
  for (let i = 0; i < 36; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => {
      if (currentSelected) {
        cell.innerHTML = `<img src="${currentSelected.imgUrl}" alt="${currentSelected.name}">`;
      } else {
        cell.innerHTML = '';
      }
    });
    mainGrid.appendChild(cell);
  }

  // モンスター一覧描画
  const monsterGrid = document.getElementById('monsterGrid');
  const selectedNameEl = document.getElementById('selectedName');

  function renderMonsters() {
    monsterGrid.innerHTML = '';

    // 属性・Tier・タイプの掛け合わせ絞り込み
    const filtered = monstersData.filter(m => {
      const matchAttr = (currentAttr === 'all' || m.attr === currentAttr);
      const matchTier = (currentTier === 'all' || m.tier === currentTier);
      const matchType = (currentType === 'all' || m.type === currentType);
      return matchAttr && matchTier && matchType;
    });

    filtered.forEach(m => {
      const name = m.name;
      const imgUrl = `${name}.webp`;
      const item = document.createElement('div');
      item.className = 'monster-item';
      if (currentSelected && currentSelected.name === name) {
        item.classList.add('active');
      }

      item.innerHTML = `
        <img src="${imgUrl}" alt="${name}" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='${name}.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='${name}.jpg';}else{this.style.display='none';}">
        <div class="monster-name">${name}</div>
      `;
      
      item.addEventListener('click', () => {
        document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
        if (currentSelected && currentSelected.name === name) {
          currentSelected = null;
          selectedNameEl.textContent = 'なし';
        } else {
          currentSelected = { name, imgUrl: item.querySelector('img').src };
          item.classList.add('active');
          selectedNameEl.textContent = name;
        }
      });
      monsterGrid.appendChild(item);
    });
  }

  // フィルターボタンイベント登録
  function setupFilter(groupId, attrName, callback) {
    const btns = document.querySelectorAll(`#${groupId} .filter-btn`);
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        callback(btn.dataset[attrName]);
        renderMonsters();
      });
    });
  }

  setupFilter('attrFilterGroup', 'attr', val => currentAttr = val);
  setupFilter('tierFilterGroup', 'tier', val => currentTier = val);
  setupFilter('typeFilterGroup', 'type', val => currentType = val);

  // クリアボタン
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('.cell').forEach(cell => cell.innerHTML = '');
  });

  // 初期描画
  renderMonsters();
</script>

</body>
</html>
