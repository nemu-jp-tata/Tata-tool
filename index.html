<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="モンスターの配置シミュレーションと画像保存ができるツールです。">
  <title>モンスター配置ツール</title>
  <!-- 外部CSSの読み込み -->
  <link rel="stylesheet" href="./style.css">
  <!-- html2canvasライブラリの読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container">
  <div class="header-tools">
    <div style="display: flex; gap: 6px; align-items: center;">
      <button class="btn" id="clearBtn">盤面クリア</button>
      <button class="btn" id="saveBtn" style="background: #2563eb; border-color: #3b82f6; color: #fff;">画像保存</button>
      <span style="font-size: 11px; color: #94a3b8;">選択中: <strong id="selectedName" style="color:#4ade80;">なし</strong></span>
    </div>
    <!-- 三本線メニューボタン -->
    <button class="menu-btn" id="menuOpenBtn" aria-label="メニューを開く">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- ゾンビラッシュ時のみ表示される1P / 2P 切り替えボタン -->
  <div class="player-switch-container" id="playerSwitchContainer">
    <button class="player-btn p1 active" id="btn1P">1P 視点</button>
    <button class="player-btn p2" id="btn2P">2P 視点</button>
  </div>

  <!-- 盤面フレーム -->
  <div class="board-frame" id="boardFrame">
    <div class="board-notice">こちらからゾンビが来ます ▼</div>
    <div id="mainGrid"></div>
  </div>

  <!-- モンスター選択エリア -->
  <div class="monster-frame">
    <div class="monster-title">モンスター選択</div>

    <!-- アコーディオン（絞り込みフィルター） -->
    <details class="filter-details">
      <summary class="filter-summary">
        <span>絞り込みフィルターを開く</span>
        <span class="summary-arrow">▼</span>
      </summary>
      
      <div class="filter-section">
        <!-- 1. 属性フィルター -->
        <div class="filter-row" id="attrFilterGroup">
          <span class="filter-label">属性:</span>
          <button class="filter-btn active" data-attr="all">すべて</button>
          <button class="filter-btn" data-attr="水"><img src="水属性.webp" alt="水" onerror="this.style.display='none'">水</button>
          <button class="filter-btn" data-attr="炎"><img src="炎属性.webp" alt="炎" onerror="this.style.display='none'">炎</button>
          <button class="filter-btn" data-attr="草"><img src="草属性.webp" alt="草" onerror="this.style.display='none'">草</button>
          <button class="filter-btn" data-attr="岩"><img src="岩属性.webp" alt="岩" onerror="this.style.display='none'">岩</button>
          <button class="filter-btn" data-attr="雷"><img src="雷属性.webp" alt="雷" onerror="this.style.display='none'">雷</button>
        </div>

        <!-- 2. Tier フィルター -->
        <div class="filter-row" id="tierFilterGroup">
          <span class="filter-label">Tier:</span>
          <button class="filter-btn active" data-tier="all">すべて</button>
          <button class="filter-btn" data-tier="T1">T1</button>
          <button class="filter-btn" data-tier="T2">T2</button>
          <button class="filter-btn" data-tier="T3">T3</button>
          <button class="filter-btn" data-tier="T4">T4</button>
        </div>

        <!-- 3. タイプ フィルター -->
        <div class="filter-row" id="typeFilterGroup">
          <span class="filter-label">タイプ:</span>
          <button class="filter-btn active" data-type="all">すべて</button>
          <button class="filter-btn" data-type="タンク"><img src="タンク.webp" alt="タンク" onerror="this.style.display='none'">タンク</button>
          <button class="filter-btn" data-type="ファイター"><img src="ファイター.webp" alt="ファイター" onerror="this.style.display='none'">ファイター</button>
          <button class="filter-btn" data-type="ダメージ"><img src="ダメージ.webp" alt="ダメージ" onerror="this.style.display='none'">ダメージ</button>
          <button class="filter-btn" data-type="ヒール"><img src="ヒール.webp" alt="ヒール" onerror="this.style.display='none'">ヒール</button>
          <button class="filter-btn" data-type="サポート"><img src="サポート.webp" alt="サポート" onerror="this.style.display='none'">サポート</button>
          <button class="filter-btn" data-type="スペシャル"><img src="スペシャル.webp" alt="スペシャル" onerror="this.style.display='none'">スペシャル</button>
        </div>
      </div>
    </details>

    <!-- モンスター一覧 -->
    <div class="monster-grid" id="monsterGrid"></div>
  </div>
</div>

<!-- 右からスライドしてくるドロワーメニュー -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer-menu" id="drawerMenu">
    <div>
      <div class="drawer-title">ステージ選択</div>
      <div class="drawer-item active" id="normalStageBtn">ノーマルステージ (5×5)</div>
      <div class="drawer-item" id="zombieStageBtn">ゾンビラッシュ (6×6)</div>
    </div>
    <div class="drawer-footer">
      by nemu
    </div>
  </div>
</div>

<!-- 外部のデータファイルを読み込む -->
<script src="monsters.js"></script>

<script>
  const monstersData = rawMonstersData.map(m => ({
    name: m.name,
    species: m.species,
    attr: m.type,
    tier: "T" + m.T,
    tierNum: m.T,
    type: m.role
  }));

  let currentSelected = null;
  let currentAttr = "all";
  let currentTier = "all";
  let currentType = "all";
  let currentGridSize = parseInt(localStorage.getItem('monsterBoard_size')) || 5;
  let currentPlayer = "1P";

  const mainGrid = document.getElementById('mainGrid');
  const playerSwitchContainer = document.getElementById('playerSwitchContainer');
  const btn1P = document.getElementById('btn1P');
  const btn2P = document.getElementById('btn2P');
  const normalStageBtn = document.getElementById('normalStageBtn');
  const zombieStageBtn = document.getElementById('zombieStageBtn');

  // ローカルストレージに盤面状態を保存する関数
  function saveBoardState() {
    const cellsData = [];
    document.querySelectorAll('#mainGrid .cell').forEach((cell, index) => {
      const img = cell.querySelector('img');
      if (img) {
        cellsData.push({
          index: index,
          src: img.src,
          species: img.dataset.species,
          tier: img.dataset.tier,
          player: img.dataset.player,
          className: cell.className
        });
      }
    });
    localStorage.setItem('monsterBoard_size', currentGridSize);
    localStorage.setItem('monsterBoard_cells', JSON.stringify(cellsData));
  }

  // ローカルストレージから盤面状態を復元する関数
  function loadBoardState() {
    const savedCells = JSON.parse(localStorage.getItem('monsterBoard_cells') || '[]');
    savedCells.forEach(data => {
      const cell = mainGrid.children[data.index];
      if (cell) {
        cell.className = data.className;
        cell.innerHTML = `
          <img src="${data.src}" 
               alt="" 
               data-species="${data.species}" 
               data-tier="${data.tier}"
               data-player="${data.player}">
        `;
      }
    });
  }

  function buildBoard(size) {
    currentGridSize = size;
    mainGrid.className = `grid-${size}x${size}`;
    
    if (size === 6) {
      playerSwitchContainer.classList.add('show');
      zombieStageBtn.classList.add('active');
      normalStageBtn.classList.remove('active');
    } else {
      playerSwitchContainer.classList.remove('show');
      normalStageBtn.classList.add('active');
      zombieStageBtn.classList.remove('active');
      currentPlayer = "1P";
    }

    mainGrid.innerHTML = '';
    for (let i = 0; i < size * size; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      
      cell.addEventListener('click', () => {
        if (!currentSelected) {
          cell.innerHTML = '';
          cell.className = 'cell';
          saveBoardState();
          return;
        }

        const targetSpecies = currentSelected.species;
        const targetTier = currentSelected.tierNum;
        
        let isAlreadyOnBoard = false;
        document.querySelectorAll('#mainGrid .cell').forEach(c => {
          const img = c.querySelector('img');
          if (img && parseInt(img.dataset.tier) === targetTier && img.dataset.species === targetSpecies) {
            if (currentGridSize === 5 || img.dataset.player === currentPlayer) {
              isAlreadyOnBoard = true;
            }
          }
        });

        const existingImg = cell.querySelector('img');
        const isReplacingSelf = existingImg && 
                                parseInt(existingImg.dataset.tier) === targetTier && 
                                existingImg.dataset.species === targetSpecies &&
                                (currentGridSize === 5 || existingImg.dataset.player === currentPlayer);

        if (isAlreadyOnBoard && !isReplacingSelf) {
          const playerText = (currentGridSize === 6) ? `[${currentPlayer}]` : "";
          alert(`${playerText} ${currentSelected.name} (T${targetTier}) は既に配置されています。`);
          return;
        }

        cell.className = 'cell';
        if (currentGridSize === 6) {
          cell.classList.add(currentPlayer === '1P' ? 'p1-cell' : 'p2-cell');
        }

        cell.innerHTML = `
          <img src="${currentSelected.imgUrl}" 
               alt="${currentSelected.name}" 
               data-species="${targetSpecies}" 
               data-tier="${targetTier}"
               data-player="${currentGridSize === 6 ? currentPlayer : '1P'}">
        `;
        
        saveBoardState();
      });
      mainGrid.appendChild(cell);
    }

    loadBoardState();
  }

  const monsterGrid = document.getElementById('monsterGrid');
  const selectedNameEl = document.getElementById('selectedName');

  function renderMonsters() {
    monsterGrid.innerHTML = '';

    const filtered = monstersData.filter(m => {
      const matchAttr = (currentAttr === 'all' || m.attr === currentAttr);
      const matchTier = (currentTier === 'all' || m.tier === currentTier);
      const matchType = (currentType === 'all' || m.type === currentType);
      return matchAttr && matchTier && matchType;
    });

    filtered.forEach(m => {
      const name = m.name;
      const imgUrl = `${name}.webp`;
      const typeImgUrl = `${m.type}.webp`;
      
      const item = document.createElement('div');
      item.className = 'monster-item';
      item.dataset.attr = m.attr;
      
      if (currentSelected && currentSelected.name === name) {
        item.classList.add('active');
      }

      item.innerHTML = `
        <img class="monster-type-icon" src="${typeImgUrl}" alt="${m.type}" onerror="this.style.display='none'">
        <img class="monster-thumb" src="${imgUrl}" alt="${name}" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='${name}.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='${name}.jpg';}else{this.style.display='none';}">
        <div class="monster-name">${name}</div>
      `;
      
      item.addEventListener('click', () => {
        document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
        if (currentSelected && currentSelected.name === name) {
          currentSelected = null;
          selectedNameEl.textContent = 'なし';
        } else {
          currentSelected = { 
            name, 
            species: m.species,
            tierNum: m.tierNum,
            imgUrl: item.querySelector('.monster-thumb').src 
          };
          item.classList.add('active');
          selectedNameEl.textContent = name;
        }
      });
      monsterGrid.appendChild(item);
    });
  }

  function setupFilter(groupId, attrName, callback) {
    const btns = document.querySelectorAll(`#${groupId} .filter-btn`);
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        callback(btn.dataset[attrName]);
        renderMonsters();
      });
    });
  }

  setupFilter('attrFilterGroup', 'attr', val => currentAttr = val);
  setupFilter('tierFilterGroup', 'tier', val => currentTier = val);
  setupFilter('typeFilterGroup', 'type', val => currentType = val);

  // クリアボタン
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('.cell').forEach(cell => {
      cell.innerHTML = '';
      cell.className = 'cell';
    });
    localStorage.removeItem('monsterBoard_cells');
  });

  // 画像保存ボタン
  document.getElementById('saveBtn').addEventListener('click', () => {
    const boardFrame = document.getElementById('boardFrame');
    const cells = document.querySelectorAll('.cell');
    
    // 【縦伸び防止】html2canvasのバグ対策として、撮影直前にセルの高さをpxで強制的に正方形に固定する
    cells.forEach(cell => {
      const cellWidth = cell.getBoundingClientRect().width;
      cell.style.height = `${cellWidth}px`;
    });

    const rect = boardFrame.getBoundingClientRect();
    
    html2canvas(boardFrame, {
      backgroundColor: '#181a29',
      scale: 2, // 【サイズ調整】2から1に変更し、大きすぎる問題（約800px→約400px）を解決
      width: rect.width,
      height: rect.height,
      windowWidth: document.documentElement.clientWidth,
      useCORS: true
    }).then(canvas => {
      // 撮影完了後、スタイルの強制固定を解除
      cells.forEach(cell => {
        cell.style.height = '';
      });

      const imageURL = canvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      downloadLink.href = imageURL;
      downloadLink.download = `monster-board-${currentGridSize}x${currentGridSize}.png`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }).catch(err => {
      console.error('画像保存エラー:', err);
      alert('画像の保存に失敗しました。');
      
      // エラー時も解除
      cells.forEach(cell => {
        cell.style.height = '';
      });
    });
  });

  // 1P / 2P 切替ボタンの挙動
  btn1P.addEventListener('click', () => {
    currentPlayer = "1P";
    btn1P.classList.add('active');
    btn2P.classList.remove('active');
  });

  btn2P.addEventListener('click', () => {
    currentPlayer = "2P";
    btn2P.classList.add('active');
    btn1P.classList.remove('active');
  });

  // ドロワーメニューロジック
  const menuOpenBtn = document.getElementById('menuOpenBtn');
  const drawerOverlay = document.getElementById('drawerOverlay');

  menuOpenBtn.addEventListener('click', () => {
    drawerOverlay.classList.add('open');
  });

  drawerOverlay.addEventListener('click', (e) => {
    if (e.target === drawerOverlay) {
      drawerOverlay.classList.remove('open');
    }
  });

  normalStageBtn.addEventListener('click', () => {
    if (currentGridSize !== 5) {
      localStorage.removeItem('monsterBoard_cells');
    }
    buildBoard(5);
    drawerOverlay.classList.remove('open');
  });

  zombieStageBtn.addEventListener('click', () => {
    if (currentGridSize !== 6) {
      localStorage.removeItem('monsterBoard_cells');
    }
    buildBoard(6);
    drawerOverlay.classList.remove('open');
  });

  // 初期化
  buildBoard(currentGridSize);
  renderMonsters();
</script>

</body>
</html>
