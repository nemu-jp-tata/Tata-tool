<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスター配置ツール</title>
  <!-- 外部CSSの読み込み -->
  <link rel="stylesheet" href="./style.css">
  <!-- html2canvasライブラリの読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container" id="appContainer">
  <!-- 左カラム（ボタン関係・切替・盤面をひとまとめに配置） -->
  <div class="left-column">
    <div class="header-tools">
      <div style="display: flex; gap: 6px; align-items: center;">
        <button class="btn" id="clearBtn">盤面クリア</button>
        <button class="btn" id="saveBtn" style="background: #2563eb; border-color: #3b82f6; color: #fff;">画像保存</button>
        <span style="font-size: 11px; color: #94a3b8;">選択中: <strong id="selectedName" style="color:#4ade80;">なし</strong></span>
      </div>
      <!-- 三本線メニューボタン -->
      <button class="menu-btn" id="menuOpenBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- ゾンビラッシュ時のみ表示される1P / 2P 切り替えボタン -->
    <div class="player-switch-container" id="playerSwitchContainer">
      <button class="player-btn p1 active" id="btn1P">1P 視点</button>
      <button class="player-btn p2" id="btn2P">2P 視点</button>
    </div>

    <!-- 盤面フレーム -->
    <div class="board-frame" id="boardFrame">
      <div class="board-notice">こちらからゾンビが来ます ▼</div>
      <div id="mainGrid"></div>
    </div>
  </div>

  <!-- 右カラム：モンスター選択エリア（タタ選択） -->
  <div class="monster-frame" id="monsterFrame">
    <div class="monster-title">モンスター選択</div>

    <!-- アコーディオン（絞り込みフィルター） -->
    <details class="filter-details">
      <summary class="filter-summary">
        <span>絞り込みフィルターを開く</span>
        <span class="summary-arrow">▼</span>
      </summary>
      
      <div class="filter-section">
        <!-- 1. 属性フィルター -->
        <div class="filter-row" id="attrFilterGroup">
          <span class="filter-label">属性:</span>
          <button class="filter-btn active" data-attr="all">すべて</button>
          <button class="filter-btn" data-attr="水"><img src="水属性.webp" alt="水" onerror="this.style.display='none'">水</button>
          <button class="filter-btn" data-attr="炎"><img src="炎属性.webp" alt="炎" onerror="this.style.display='none'">炎</button>
          <button class="filter-btn" data-attr="草"><img src="草属性.webp" alt="草" onerror="this.style.display='none'">草</button>
          <button class="filter-btn" data-attr="岩"><img src="岩属性.webp" alt="岩" onerror="this.style.display='none'">岩</button>
          <button class="filter-btn" data-attr="雷"><img src="雷属性.webp" alt="雷" onerror="this.style.display='none'">雷</button>
        </div>

        <!-- 2. タイプ フィルター -->
        <div class="filter-row" id="typeFilterGroup">
          <span class="filter-label">タイプ:</span>
          <button class="filter-btn active" data-type="all">すべて</button>
          <button class="filter-btn" data-type="タンク"><img src="タンク.webp" alt="タンク" onerror="this.style.display='none'">タンク</button>
          <button class="filter-btn" data-type="ファイター"><img src="ファイター.webp" alt="ファイター" onerror="this.style.display='none'">ファイター</button>
          <button class="filter-btn" data-type="ダメージ"><img src="ダメージ.webp" alt="ダメージ" onerror="this.style.display='none'">ダメージ</button>
          <button class="filter-btn" data-type="ヒール"><img src="ヒール.webp" alt="ヒール" onerror="this.style.display='none'">ヒール</button>
          <button class="filter-btn" data-type="サポート"><img src="サポート.webp" alt="サポート" onerror="this.style.display='none'">サポート</button>
          <button class="filter-btn" data-type="スペシャル"><img src="スペシャル.webp" alt="スペシャル" onerror="this.style.display='none'">スペシャル</button>
        </div>
      </div>
    </details>

    <!-- モンスター一覧 -->
    <div class="monster-grid" id="monsterGrid"></div>
  </div>
</div>

<!-- ドラッグ中に指/マウスに追従するゴースト画像要素 -->
<div id="dragGhost" class="drag-ghost"></div>

<!-- 右からスライドしてくるドロワーメニュー -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer-menu" id="drawerMenu">
    <div>
      <div class="drawer-title">ステージ選択</div>
      <div class="drawer-item active" id="normalStageBtn">ノーマルステージ (5×5)</div>
      <div class="drawer-item" id="zombieStageBtn">ゾンビラッシュ (6×6)</div>

      <!-- 操作説明のヒント -->
      <div style="margin-top: 24px; padding: 12px; background: #1e293b; border-radius: 8px; font-size: 12px; color: #cbd5e1; line-height: 1.5; border: 1px solid #334155;">
        <div style="font-weight: bold; color: #4ade80; margin-bottom: 4px;">💡 操作のヒント</div>
        ・右側のモンスターをタップ選択、または直接ドラッグして盤面に配置できます。<br>
        ・盤面のモンスターをタップで削除、長押しドラッグで移動できます。<br>
        ・タタ選択ボックス上でドロップすると元の位置に戻り（削除され）、盤面外では元の位置を維持します。
      </div>
    </div>
    <!-- こっそり入るクレジット -->
    <div class="drawer-footer" style="margin-top: auto; text-align: center; font-size: 10px; color: #475569; letter-spacing: 0.5px;">
      by ぱんだ
    </div>
  </div>
</div>

<!-- 外部のデータファイルを読み込む -->
<script src="monsters.js"></script>

<script>
  // 全データをマッピング
  const allMonsters = rawMonstersData.map(m => ({
    name: m.name,
    species: m.species,
    attr: m.type,
    tier: "T" + m.T,
    tierNum: m.T,
    type: m.role
  }));

  // 各種族が持っているTierのリストをマッピング
  const speciesTiersMap = {};
  allMonsters.forEach(m => {
    if (!speciesTiersMap[m.species]) speciesTiersMap[m.species] = [];
    if (!speciesTiersMap[m.species].includes(m.tierNum)) {
      speciesTiersMap[m.species].push(m.tierNum);
    }
  });
  Object.keys(speciesTiersMap).forEach(species => {
    speciesTiersMap[species].sort((a, b) => a - b);
  });

  // 一覧には各種族の最も低いTierのデータのみを抽出してベースにする
  const baseMonstersMap = new Map();
  allMonsters.forEach(m => {
    if (!baseMonstersMap.has(m.species) || m.tierNum < baseMonstersMap.get(m.species).tierNum) {
      baseMonstersMap.set(m.species, m);
    }
  });
  const monstersData = Array.from(baseMonstersMap.values());

  let currentSelected = null; // { species, tierNum, name, imgUrl }
  let currentAttr = "all";
  let currentType = "all";
  let currentGridSize = parseInt(localStorage.getItem('monsterBoard_size')) || 5;
  let currentPlayer = "1P";

  // ドラッグ＆ドロップ用の状態管理
  let draggingItem = null; // { type: 'board'|'palette', src, species, tier, player, sourceIndex }
  const dragGhost = document.getElementById('dragGhost');

  const mainGrid = document.getElementById('mainGrid');
  const monsterFrame = document.getElementById('monsterFrame');
  const playerSwitchContainer = document.getElementById('playerSwitchContainer');
  const btn1P = document.getElementById('btn1P');
  const btn2P = document.getElementById('btn2P');
  const normalStageBtn = document.getElementById('normalStageBtn');
  const zombieStageBtn = document.getElementById('zombieStageBtn');
  const selectedNameEl = document.getElementById('selectedName');

  // ローカルストレージに盤面状態を保存する関数
  function saveBoardState() {
    const cellsData = [];
    document.querySelectorAll('#mainGrid .cell').forEach((cell, index) => {
      const img = cell.querySelector('img');
      if (img) {
        cellsData.push({
          index: index,
          src: img.src,
          species: img.dataset.species,
          tier: img.dataset.tier,
          player: img.dataset.player,
          className: cell.className
        });
      }
    });
    localStorage.setItem('monsterBoard_size', currentGridSize);
    localStorage.setItem('monsterBoard_cells', JSON.stringify(cellsData));
  }

  // ローカルストレージから盤面状態を復元する関数
  function loadBoardState() {
    const savedCells = JSON.parse(localStorage.getItem('monsterBoard_cells') || '[]');
    savedCells.forEach(data => {
      const cell = mainGrid.children[data.index];
      if (cell) {
        fillCellWithMonster(cell, data);
      }
    });
  }

  // セルにモンスター画像を設定し、ポインターイベントを付与する
  function fillCellWithMonster(cell, data) {
    cell.className = data.className;
    cell.innerHTML = `
      <img src="${data.src}" 
           alt="" 
           data-species="${data.species}" 
           data-tier="${data.tier}"
           data-player="${data.player}"
           draggable="false">
    `;

    const img = cell.querySelector('img');
    
    img.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (e.button !== 0 && e.pointerType === 'mouse') return;

      const startX = e.clientX;
      const startY = e.clientY;
      let isDragging = false;

      const cells = Array.from(mainGrid.children);
      const sourceIndex = cells.indexOf(cell);

      function onMove(moveEvent) {
        const dx = moveEvent.clientX - startX;
        const dy = moveEvent.clientY - startY;
        if (!isDragging && Math.hypot(dx, dy) > 5) {
          isDragging = true;
          draggingItem = {
            type: 'board',
            src: img.src,
            species: img.dataset.species,
            tier: img.dataset.tier,
            player: img.dataset.player,
            sourceIndex: sourceIndex,
            sourceClassName: cell.className
          };

          dragGhost.style.backgroundImage = `url(${img.src})`;
          dragGhost.style.display = 'block';
          updateGhostPosition(moveEvent.clientX, moveEvent.clientY);

          cell.innerHTML = '';
          cell.className = 'cell';
        }

        if (isDragging) {
          updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
        }
      }

      function onUp(upEvent) {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);

        if (!isDragging) {
          // タップされた場合：盤面から削除
          cell.innerHTML = '';
          cell.className = 'cell';
          saveBoardState();
          return;
        }

        // ドラッグ終了時の処理
        dragGhost.style.display = 'none';
        const dropTarget = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
        const targetCell = dropTarget ? dropTarget.closest('.cell') : null;
        const isOverMonsterFrame = dropTarget && monsterFrame.contains(dropTarget);

        // タタ選択ボックスの上でドロップされた場合 → 元に戻さず削除する
        if (isOverMonsterFrame) {
          draggingItem = null;
          saveBoardState();
          return;
        }

        // 盤面外にドロップされた場合 → 元の位置に戻す
        if (!targetCell || !mainGrid.contains(targetCell)) {
          revertToSourceCell();
          return;
        }

        const targetIndex = cells.indexOf(targetCell);
        const existingImg = targetCell.querySelector('img');
        const targetSpecies = draggingItem.species;

        let isSpeciesOnBoard = false;
        cells.forEach((c, idx) => {
          if (idx === targetIndex) return;
          const im = c.querySelector('img');
          if (im && im.dataset.species === targetSpecies) {
            if (currentGridSize === 5 || im.dataset.player === draggingItem.player) {
              isSpeciesOnBoard = true;
            }
          }
        });

        const isReplacingSelf = existingImg && 
                                existingImg.dataset.species === targetSpecies &&
                                (currentGridSize === 5 || existingImg.dataset.player === draggingItem.player);

        if (isSpeciesOnBoard) {
          const playerText = (currentGridSize === 6) ? `[${draggingItem.player}]` : "";
          alert(`${playerText} 同じ種族のモンスターは既に盤面に配置されています。`);
          revertToSourceCell();
          return;
        }

        if (existingImg && !isReplacingSelf) {
          alert('すでにモンスターが配置されているセルには移動できません。');
          revertToSourceCell();
          return;
        }

        targetCell.className = 'cell';
        if (currentGridSize === 6) {
          targetCell.classList.add(draggingItem.player === '1P' ? 'p1-cell' : 'p2-cell');
        }

        fillCellWithMonster(targetCell, {
          src: draggingItem.src,
          species: draggingItem.species,
          tier: draggingItem.tier,
          player: draggingItem.player,
          className: targetCell.className
        });

        draggingItem = null;
        saveBoardState();
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  function updateGhostPosition(x, y) {
    dragGhost.style.left = `${x - 25}px`;
    dragGhost.style.top = `${y - 25}px`;
  }

  function revertToSourceCell() {
    if (!draggingItem || draggingItem.type !== 'board') return;
    const cells = Array.from(mainGrid.children);
    const sourceCell = cells[draggingItem.sourceIndex];
    if (sourceCell) {
      fillCellWithMonster(sourceCell, {
        src: draggingItem.src,
        species: draggingItem.species,
        tier: draggingItem.tier,
        player: draggingItem.player,
        className: draggingItem.sourceClassName
      });
    }
    draggingItem = null;
    saveBoardState();
  }

  function buildBoard(size) {
    currentGridSize = size;
    mainGrid.className = `grid-${size}x${size}`;
    
    if (size === 6) {
      playerSwitchContainer.classList.add('show');
      zombieStageBtn.classList.add('active');
      normalStageBtn.classList.remove('active');
    } else {
      playerSwitchContainer.classList.remove('show');
      normalStageBtn.classList.add('active');
      zombieStageBtn.classList.remove('active');
      currentPlayer = "1P";
    }

    mainGrid.innerHTML = '';
    for (let i = 0; i < size * size; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      
      // 空セルをクリックして新規配置する処理
      cell.addEventListener('click', (e) => {
        e.stopPropagation();

        if (!currentSelected) {
          cell.innerHTML = '';
          cell.className = 'cell';
          saveBoardState();
          return;
        }

        const targetSpecies = currentSelected.species;
        const targetTier = currentSelected.tierNum;
        
        let totalCount = 0;
        let p1Count = 0;
        let p2Count = 0;
        document.querySelectorAll('#mainGrid .cell').forEach(c => {
          const im = c.querySelector('img');
          if (im) {
            totalCount++;
            if (im.dataset.player === '1P') p1Count++;
            if (im.dataset.player === '2P') p2Count++;
          }
        });

        const existingImg = cell.querySelector('img');
        const isReplacingSelf = existingImg && 
                                existingImg.dataset.species === targetSpecies &&
                                (currentGridSize === 5 || existingImg.dataset.player === currentPlayer);

        if (!isReplacingSelf) {
          if (currentGridSize === 5 && totalCount >= 15) {
            alert('ノーマルステージでは最大15体までしか配置できません。');
            return;
          }
          if (currentGridSize === 6) {
            if (currentPlayer === '1P' && p1Count >= 15) {
              alert('1Pは最大15体までしか配置できません。');
              return;
            }
            if (currentPlayer === '2P' && p2Count >= 15) {
              alert('2Pは最大15体までしか配置できません。');
              return;
            }
          }
        }

        let isSpeciesOnBoard = false;
        document.querySelectorAll('#mainGrid .cell').forEach(c => {
          const im = c.querySelector('img');
          if (im && im.dataset.species === targetSpecies) {
            if (currentGridSize === 5 || im.dataset.player === currentPlayer) {
              if (c !== cell) {
                isSpeciesOnBoard = true;
              }
            }
          }
        });

        if (isSpeciesOnBoard) {
          const playerText = (currentGridSize === 6) ? `[${currentPlayer}]` : "";
          alert(`${playerText} 同じ種族のモンスターは既に盤面に配置されています。`);
          return;
        }

        const newCellClassName = 'cell ' + (currentGridSize === 6 ? (currentPlayer === '1P' ? 'p1-cell' : 'p2-cell') : '');
        
        fillCellWithMonster(cell, {
          src: currentSelected.imgUrl,
          species: targetSpecies,
          tier: targetTier,
          player: currentGridSize === 6 ? currentPlayer : '1P',
          className: newCellClassName.trim()
        });
        
        currentSelected = null;
        selectedNameEl.textContent = 'なし';
        saveBoardState();
        renderMonsters();
      });

      mainGrid.appendChild(cell);
    }

    loadBoardState();
  }

  const monsterGrid = document.getElementById('monsterGrid');

  function renderMonsters() {
    monsterGrid.innerHTML = '';

    const filtered = monstersData.filter(m => {
      const matchAttr = (currentAttr === 'all' || m.attr === currentAttr);
      const matchType = (currentType === 'all' || m.type === currentType);
      return matchAttr && matchType;
    });

    filtered.forEach(baseM => {
      const species = baseM.species;

      let activeTierNum = speciesTiersMap[species][0];
      let displayMonster = baseM;

      if (currentSelected && currentSelected.species === species) {
        activeTierNum = currentSelected.tierNum;
        const found = allMonsters.find(m => m.species === species && m.tierNum === activeTierNum);
        if (found) displayMonster = found;
      }

      const name = displayMonster.name;
      const imgUrl = `${name}.webp`;
      const typeImgUrl = `${baseM.type}.webp`;
      
      const item = document.createElement('div');
      item.className = 'monster-item';
      item.dataset.attr = baseM.attr;
      
      if (currentSelected && currentSelected.species === species) {
        item.classList.add('active');
      }

      item.innerHTML = `
        <img class="monster-type-icon" src="${typeImgUrl}" alt="${baseM.type}" onerror="this.style.display='none'" draggable="false">
        <img class="monster-thumb" src="${imgUrl}" alt="${name}" draggable="false" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='${name}.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='${name}.jpg';}else{this.style.display='none';}">
        <div class="monster-name">${name}</div>
      `;

      item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.button !== 0 && e.pointerType === 'mouse') return;

        const startX = e.clientX;
        const startY = e.clientY;
        let isDragging = false;

        const availableTiers = speciesTiersMap[species];
        const minTier = availableTiers[0];
        const t1Monster = allMonsters.find(m => m.species === species && m.tierNum === minTier) || baseM;
        const paletteItemData = {
          species: species,
          tierNum: minTier,
          name: t1Monster.name,
          imgUrl: `${t1Monster.name}.webp`
        };

        function onMove(moveEvent) {
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (!isDragging && Math.hypot(dx, dy) > 5) {
            isDragging = true;
            draggingItem = {
              type: 'palette',
              src: paletteItemData.imgUrl,
              species: paletteItemData.species,
              tier: paletteItemData.tierNum,
              player: currentGridSize === 6 ? currentPlayer : '1P'
            };

            dragGhost.style.backgroundImage = `url(${paletteItemData.imgUrl})`;
            dragGhost.style.display = 'block';
            updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
          }

          if (isDragging) {
            updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
          }
        }

        function onUp(upEvent) {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);

          if (!isDragging) {
            if (currentSelected && currentSelected.species === species) {
              const currentIndex = availableTiers.indexOf(currentSelected.tierNum);
              if (currentIndex < availableTiers.length - 1) {
                const nextTier = availableTiers[currentIndex + 1];
                currentSelected.tierNum = nextTier;
                const nextM = allMonsters.find(m => m.species === species && m.tierNum === nextTier);
                if (nextM) {
                  currentSelected.name = nextM.name;
                  currentSelected.imgUrl = `${nextM.name}.webp`;
                }
              } else {
                currentSelected = null;
              }
            } else {
              currentSelected = paletteItemData;
            }

            renderMonsters();
            if (currentSelected) {
              selectedNameEl.textContent = `${currentSelected.name} (T${currentSelected.tierNum})`;
            } else {
              selectedNameEl.textContent = 'なし';
            }
            return;
          }

          dragGhost.style.display = 'none';
          const dropTarget = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
          const targetCell = dropTarget ? dropTarget.closest('.cell') : null;
          const cells = Array.from(mainGrid.children);

          if (targetCell && mainGrid.contains(targetCell)) {
            const targetIndex = cells.indexOf(targetCell);
            const existingImg = targetCell.querySelector('img');
            const targetSpecies = draggingItem.species;

            let totalCount = 0;
            let p1Count = 0;
            let p2Count = 0;
            cells.forEach(c => {
              const im = c.querySelector('img');
              if (im) {
                totalCount++;
                if (im.dataset.player === '1P') p1Count++;
                if (im.dataset.player === '2P') p2Count++;
              }
            });

            const isReplacingSelf = existingImg && 
                                    existingImg.dataset.species === targetSpecies &&
                                    (currentGridSize === 5 || existingImg.dataset.player === draggingItem.player);

            if (!isReplacingSelf) {
              if (currentGridSize === 5 && totalCount >= 15) {
                alert('ノーマルステージでは最大15体までしか配置できません。');
                draggingItem = null;
                return;
              }
              if (currentGridSize === 6) {
                if (draggingItem.player === '1P' && p1Count >= 15) {
                  alert('1Pは最大15体までしか配置できません。');
                  draggingItem = null;
                  return;
                }
                if (draggingItem.player === '2P' && p2Count >= 15) {
                  alert('2Pは最大15体までしか配置できません。');
                  draggingItem = null;
                  return;
                }
              }
            }

            let isSpeciesOnBoard = false;
            cells.forEach((c, idx) => {
              if (idx === targetIndex) return;
              const im = c.querySelector('img');
              if (im && im.dataset.species === targetSpecies) {
                if (currentGridSize === 5 || im.dataset.player === draggingItem.player) {
                  isSpeciesOnBoard = true;
                }
              }
            });

            if (isSpeciesOnBoard) {
              const playerText = (currentGridSize === 6) ? `[${draggingItem.player}]` : "";
              alert(`${playerText} 同じ種族のモンスターは既に盤面に配置されています。`);
              draggingItem = null;
              return;
            }

            if (existingImg && !isReplacingSelf) {
              alert('すでにモンスターが配置されているセルには移動できません。');
              draggingItem = null;
              return;
            }

            targetCell.className = 'cell';
            if (currentGridSize === 6) {
              targetCell.classList.add(draggingItem.player === '1P' ? 'p1-cell' : 'p2-cell');
            }

            fillCellWithMonster(targetCell, {
              src: draggingItem.src,
              species: draggingItem.species,
              tier: draggingItem.tier,
              player: draggingItem.player,
              className: targetCell.className
            });

            saveBoardState();
          }

          draggingItem = null;
        }

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      monsterGrid.appendChild(item);
    });
  }

  // 選択解除機能：盤面のセルやモンスターアイテム以外の場所をクリックした場合に解除
  document.getElementById('appContainer').addEventListener('click', (e) => {
    if (!e.target.closest('.cell') && !e.target.closest('.monster-item')) {
      if (currentSelected) {
        currentSelected = null;
        selectedNameEl.textContent = 'なし';
        renderMonsters();
      }
    }
  });

  function setupFilter(groupId, attrName, callback) {
    const btns = document.querySelectorAll(`#${groupId} .filter-btn`);
    btns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        callback(btn.dataset[attrName]);
        renderMonsters();
      });
    });
  }

  setupFilter('attrFilterGroup', 'attr', val => currentAttr = val);
  setupFilter('typeFilterGroup', 'type', val => currentType = val);

  document.getElementById('clearBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    currentSelected = null;
    selectedNameEl.textContent = 'なし';
    document.querySelectorAll('.cell').forEach(cell => {
      cell.innerHTML = '';
      cell.className = 'cell';
    });
    localStorage.removeItem('monsterBoard_cells');
    renderMonsters();
  });

  document.getElementById('saveBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const boardFrame = document.getElementById('boardFrame');
    const cells = document.querySelectorAll('.cell');
    
    cells.forEach(cell => {
      const cellWidth = cell.getBoundingClientRect().width;
      cell.style.height = `${cellWidth}px`;
    });

    const rect = boardFrame.getBoundingClientRect();
    
    html2canvas(boardFrame, {
      backgroundColor: '#181a29',
      scale: 1.5,
      width: rect.width,
      height: rect.height,
      windowWidth: document.documentElement.clientWidth,
      useCORS: true
    }).then(canvas => {
      cells.forEach(cell => {
        cell.style.height = '';
      });

      const imageURL = canvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      downloadLink.href = imageURL;
      downloadLink.download = `monster-board-${currentGridSize}x${currentGridSize}.png`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }).catch(err => {
      console.error('画像保存エラー:', err);
      alert('画像の保存に失敗しました。');
      cells.forEach(cell => {
        cell.style.height = '';
      });
    });
  });

  btn1P.addEventListener('click', (e) => {
    e.stopPropagation();
    currentPlayer = "1P";
    btn1P.classList.add('active');
    btn2P.classList.remove('active');
  });

  btn2P.addEventListener('click', (e) => {
    e.stopPropagation();
    currentPlayer = "2P";
    btn2P.classList.add('active');
    btn1P.classList.remove('active');
  });

  const menuOpenBtn = document.getElementById('menuOpenBtn');
  const drawerOverlay = document.getElementById('drawerOverlay');
  const drawerMenu = document.getElementById('drawerMenu');

  menuOpenBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    drawerOverlay.classList.add('open');
  });

  drawerOverlay.addEventListener('click', (e) => {
    if (e.target === drawerOverlay) {
      drawerOverlay.classList.remove('open');
    }
  });

  drawerMenu.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  normalStageBtn.addEventListener('click', () => {
    if (currentGridSize !== 5) {
      localStorage.removeItem('monsterBoard_cells');
    }
    currentSelected = null;
    selectedNameEl.textContent = 'なし';
    buildBoard(5);
    renderMonsters();
    drawerOverlay.classList.remove('open');
  });

  zombieStageBtn.addEventListener('click', () => {
    if (currentGridSize !== 6) {
      localStorage.removeItem('monsterBoard_cells');
    }
    currentSelected = null;
    selectedNameEl.textContent = 'なし';
    buildBoard(6);
    renderMonsters();
    drawerOverlay.classList.remove('open');
  });

  buildBoard(currentGridSize);
  renderMonsters();
</script>

</body>
</html>
