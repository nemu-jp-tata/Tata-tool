<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タタ配置ツール</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container" id="appContainer">

  <!-- 左カラム（タイトル・ボタン関係・盤面） -->
 <div class="left-column">
  <!-- タイトル入力欄 -->
  <div class="title-container">
    <input type="text" class="app-title-input" id="appTitleInput" value="タタ配置ツール" placeholder="タイトルを入力..." maxlength="20">
  </div>

    <div class="header-tools">
      <div style="display: flex; gap: 6px; align-items: center;">
        <a href="./tierlist.html" class="btn btn-back" style="text-decoration: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.2; padding: 4px 8px; font-size: 11px;">
          <span>← ティア表</span>
          <span>メーカーへ</span>
        </a>
        <button class="btn" id="clearBtn">盤面クリア</button>
        <button class="btn" id="saveBtn" style="background: #2563eb; border-color: #3b82f6; color: #fff;">画像保存</button>
        <span style="font-size: 11px; color: #94a3b8;">選択中: <strong id="selectedName" style="color:#4ade80;">なし</strong></span>
      </div>
      
      <button class="menu-btn" id="menuOpenBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- プレイヤー切り替えボタン（ゾンビラッシュ用） -->
    <div class="player-switch-container" id="playerSwitchContainer">
      <button class="player-btn p1 active" id="btn1P">1P 視点</button>
      <button class="player-btn p2" id="btn2P">2P 視点</button>
    </div>

    <!-- チップセットエリア（3つの四角い枠） -->
    <div class="chipset-container">
      <div class="chipset-title">チップセット</div>
      <div class="chipset-slots">
        <div class="chipset-slot"></div>
        <div class="chipset-slot"></div>
        <div class="chipset-slot"></div>
      </div>
    </div>

    <!-- 盤面フレーム -->
    <div class="board-frame" id="boardFrame">
      <div class="board-notice">こちらからゾンビが来ます ▼</div>
      <div id="mainGrid"></div>
    </div>
  </div>

  <!-- 右カラム：モンスター選択エリア -->
  <div class="monster-frame" id="monsterFrame">
    <div class="monster-title">タタ選択</div>

    <details class="filter-details">
      <summary class="filter-summary">
        <span>絞り込みフィルターを開く</span>
        <span class="summary-arrow">▼</span>
      </summary>
      
      <div class="filter-section">
        <div class="filter-row" id="attrFilterGroup">
          <span class="filter-label">属性:</span>
          <button class="filter-btn active" data-attr="all">すべて</button>
          <button class="filter-btn" data-attr="水"><img src="水属性.webp" alt="水" onerror="this.style.display='none'">水</button>
          <button class="filter-btn" data-attr="炎"><img src="炎属性.webp" alt="炎" onerror="this.style.display='none'">炎</button>
          <button class="filter-btn" data-attr="草"><img src="草属性.webp" alt="草" onerror="this.style.display='none'">草</button>
          <button class="filter-btn" data-attr="岩"><img src="岩属性.webp" alt="岩" onerror="this.style.display='none'">岩</button>
          <button class="filter-btn" data-attr="雷"><img src="雷属性.webp" alt="雷" onerror="this.style.display='none'">雷</button>
        </div>

        <div class="filter-row" id="typeFilterGroup">
          <span class="filter-label">タイプ:</span>
          <button class="filter-btn active" data-type="all">すべて</button>
          <button class="filter-btn" data-type="タンク"><img src="タンク.webp" alt="タンク" onerror="this.style.display='none'">タンク</button>
          <button class="filter-btn" data-type="ファイター"><img src="ファイター.webp" alt="ファイター" onerror="this.style.display='none'">ファイター</button>
          <button class="filter-btn" data-type="ダメージ"><img src="ダメージ.webp" alt="ダメージ" onerror="this.style.display='none'">ダメージ</button>
          <button class="filter-btn" data-type="ヒール"><img src="ヒール.webp" alt="ヒール" onerror="this.style.display='none'">ヒール</button>
          <button class="filter-btn" data-type="サポート"><img src="サポート.webp" alt="サポート" onerror="this.style.display='none'">サポート</button>
          <button class="filter-btn" data-type="スペシャル"><img src="スペシャル.webp" alt="スペシャル" onerror="this.style.display='none'">スペシャル</button>
        </div>
      </div>
    </details>

    <div class="monster-grid" id="monsterGrid"></div>
  </div>
</div>

<div id="dragGhost" class="drag-ghost"></div>

<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer-menu" id="drawerMenu">
    <div>
      <div class="drawer-title">ステージ選択</div>
      <div class="drawer-item active" id="normalStageBtn">ノーマルステージ (5×5)</div>
      <div class="drawer-item" id="zombieStageBtn">ゾンビラッシュ (6×6)</div>

      <div style="margin-top: 24px; padding: 12px; background: #1e293b; border-radius: 8px; font-size: 12px; color: #cbd5e1; line-height: 1.5; border: 1px solid #334155;">
        <div style="font-weight: bold; color: #4ade80; margin-bottom: 4px;">💡 操作のヒント</div>
        ・タタをタップ選択、または直接ドラッグして盤面に配置できます。<br>
        ・盤面のタタをタップで削除、長押しドラッグで移動できます。<br>
        ・タタ選択ボックス上でドロップすると元の位置に戻り（削除され）、盤面外では元の位置を維持します。
      </div>
    </div>

    <div class="drawer-footer" style="margin-top: auto; padding-top: 16px; text-align: center; font-size: 10px; color: #475569; letter-spacing: 0.5px;">
      by nemu
    </div>
  </div>
</div>

<script src="monsters.js"></script>
<script src="app.js"></script>

</body>
</html>
