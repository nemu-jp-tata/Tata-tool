<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスター配置ツール</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121420;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .btn {
      background: #282d42;
      color: #e2e8f0;
      border: 1px solid #3b4261;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:active {
      background: #3b4261;
    }
    /* 6x6 グリッド */
    .board-frame {
      background: #181a29;
      border: 1px solid #282d42;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
    }
    .grid-6x6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .cell {
      background: #0f111a;
      border: 1px dashed #282d45;
      border-radius: 6px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      padding: 2px;
    }
    .cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* モンスター一覧 */
    .monster-frame {
      background: #181a29;
      border: 1px solid #282d42;
      border-radius: 12px;
      padding: 10px;
    }
    .monster-title {
      font-size: 13px;
      font-weight: bold;
      color: #e2e8f0;
      margin-bottom: 8px;
      text-align: center;
    }
    .monster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .monster-item {
      background: #0f111a;
      border: 1px solid #282d45;
      border-radius: 8px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
    }
    .monster-item.active {
      border: 2px solid #4ade80;
      background: #1e293b;
    }
    .monster-item img {
      width: 75%;
      height: 75%;
      object-fit: contain;
    }
    .monster-name {
      font-size: 9px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.1;
      word-break: break-all;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-tools">
    <span style="font-size: 12px; color: #94a3b8;">選択中: <strong id="selectedName" style="color:#4ade80;">なし</strong></span>
    <button class="btn" id="clearBtn">盤面クリア</button>
  </div>

  <!-- 6x6 マス目 -->
  <div class="board-frame">
    <div class="grid-6x6" id="mainGrid"></div>
  </div>

  <!-- 横4列のモンスター選択リスト -->
  <div class="monster-frame">
    <div class="monster-title">モンスター選択</div>
    <div class="monster-grid" id="monsterGrid"></div>
  </div>
</div>

<script>
  const monsterNames = [
    "チーシェル", "ダイシェル", "カピラス", "カピバルリー", "ネコオリ", "チルネコ", "チルレオ", "ブリズレオ",
    "ナミアシカ", "ボルザラシ", "ダブザラシ", "ダイドウオウ", "ウミミ", "ウミピョン", "ウミロップ", "アクアリーナ",
    "トコペンギン", "タフペンギン", "フブペンギン", "ペンペラー", "ツヨカニ", "ケンカニ", "クラブロー", "チョキング",
    "ポタカゲ", "ピチャカゲ", "アクアガマ", "イガマスター", "ネムクラゲ", "スヤクラゲ", "ルナドール", "オロラクイン",
    "シズクジ", "シズクチョウ", "ミストリア", "スケダコ", "ウオダコ", "オクドーム", "ホネギョ", "トゲギョ",
    "ガイセーン", "アビスカル", "トスリス", "バタリス", "スズメラ", "カエンジャク", "ヒバイヌ", "マッチバ",
    "フレベロス", "ヘルベロス", "ヒモリ", "ツノイモリ", "ボルケザード", "インフェルドラ", "コロコン", "ニコン",
    "ヨウエンビ", "キツネビア", "ワンブー", "ハンバーブー", "ブヒナベブー", "カロリキング", "ヒノムシ", "フレイムシ",
    "バタフレア", "バタブレイズ", "ヒエビ", "フレービ", "バーニフィス", "ボルケイセ", "トラーニー", "ハーミットラ",
    "ゼンガー", "マスタイガー", "ププンク", "クサンク", "マグマスク", "ボンバスカー", "ヒニャオ", "マネビネコ",
    "ネコマダラ", "フグマル", "ニギリマル", "フナモリマル", "タイショウマル", "アタタマ", "ヒガマ", "メラガマ",
    "ダルマグマ", "フタバード", "ヨツバード", "ナンモナイシ", "ハナレナイシ", "フルッグ", "フルルッグ", "ドラフルッグ",
    "フルグロウン", "コマキリ", "ハナキリ", "ヴァルキリ", "サクランティス", "グリンビィ", "チョイワルブーン", "チョーワルブーン",
    "ブーンマント", "コパンダ", "タケパンダ", "パンドウラク", "バンブオウ", "ヒマワリン", "キラワー", "サーフワリン",
    "サンフワリン", "フクログモ", "ボトルグモ", "チュラリウム", "シンラリウム", "サボール", "サボケン", "サボディビル",
    "マルッシュ", "マボロッシュ", "マダムッシュ", "イルミラージュ", "ベロパカ", "ツバルカ", "ビチャルパカ", "フリコー",
    "リーフロ", "ツリーフロ", "クロノウル", "ヤミノメ", "ヤミハナ", "ヤミマンドラ", "ダークラウン", "マドブヒ",
    "ロクブヒ", "ハリネム", "グウホッグ", "コロジュー", "ロクジュー", "ジオジュラ", "ジュラゴン", "コロカメ",
    "ガントル", "ガンタス", "ガンバンタス", "ヤンザル", "ワルキー", "イビルザル", "サルタイセイ", "モグリン",
    "モグテント", "モグトリデ", "モグパレス", "コワガルー", "ボコガルー", "ガルッキー", "ガルチャンプ", "ツブツムリ",
    "ジェムツムリ", "クォーツムリ", "アメジスネイル", "コロタマ", "コロロック", "スカラーべ", "スカリギオ", "ボウズヘビ",
    "ネンブツヘビ", "ボンノオロチ", "ホルリン", "ドリルー", "ボーランバ", "ムムカバ", "マリリンバ", "モンローバ",
    "ヒポディーバ", "ビパピー", "ビビドッグ", "ノロナマズ", "ビリナマズ", "ガオデン", "ガルルデン", "キングデン",
    "エンペラデン", "ビリジカ", "デンジカ", "ジバシカ", "マグネクス", "パチルフ", "デンロウ", "ジンロウ",
    "ジンライロウ", "モエミン", "エレコーン", "エレキリン", "ボルキリン", "ビリピヨ", "エレクトリ", "ビリビバシ",
    "ライオウム", "プラビ", "スタピョン", "ステラビット", "アストラビット", "ライメー", "シーパルス", "アラシープ",
    "アマルテラ", "エレキネコ", "デンニャン", "スピニャット", "ビリモ", "ビリモリ", "パルバット", "ヴァンパルス",
    "ピカル", "ボルタル", "ルシフェル", "ルミナリオン", "トジコモル"
  ];

  let currentSelected = null;

  // 6x6盤面生成
  const mainGrid = document.getElementById('mainGrid');
  for (let i = 0; i < 36; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => {
      if (currentSelected) {
        cell.innerHTML = `<img src="${currentSelected.imgUrl}" alt="${currentSelected.name}">`;
      } else {
        cell.innerHTML = '';
      }
    });
    mainGrid.appendChild(cell);
  }

  // モンスター一覧生成（.webp / .png / .jpg 自動対応）
  const monsterGrid = document.getElementById('monsterGrid');
  const selectedNameEl = document.getElementById('selectedName');

  monsterNames.forEach(name => {
    // まず .webp で読み込みを試し、失敗したら .png / .jpg にフォールバック
    const imgUrl = `${name}.webp`;
    const item = document.createElement('div');
    item.className = 'monster-item';
    item.innerHTML = `<img src="${imgUrl}" alt="${name}" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='${name}.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='${name}.jpg';}else{this.style.display='none';}"><div class="monster-name">${name}</div>`;
    
    item.addEventListener('click', () => {
      document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
      if (currentSelected && currentSelected.name === name) {
        currentSelected = null;
        selectedNameEl.textContent = 'なし';
      } else {
        currentSelected = { name, imgUrl: item.querySelector('img').src };
        item.classList.add('active');
        selectedNameEl.textContent = name;
      }
    });
    monsterGrid.appendChild(item);
  });

  // クリアボタン
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('.cell').forEach(cell => cell.innerHTML = '');
  });
</script>

</body>
</html>
