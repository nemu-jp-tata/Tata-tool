<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスター配置ツール</title>
  <!-- 外部CSSの読み込み -->
  <link rel="stylesheet" href="./style.css">
  <!-- html2canvasライブラリの読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container" id="appContainer">
  <!-- 左カラム -->
  <div class="left-column">
    <div class="header-tools">
      <div style="display: flex; gap: 6px; align-items: center;">
        <button class="btn" id="clearBtn">盤面クリア</button>
        <button class="btn" id="saveBtn" style="background: #2563eb; border-color: #3b82f6; color: #fff;">画像保存</button>
        <span style="font-size: 11px; color: #94a3b8;">選択中: <strong id="selectedName" style="color:#4ade80;">なし</strong></span>
      </div>
      <button class="menu-btn" id="menuOpenBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="player-switch-container" id="playerSwitchContainer">
      <button class="player-btn p1 active" id="btn1P">1P 視点</button>
      <button class="player-btn p2" id="btn2P">2P 視点</button>
    </div>

    <div class="board-frame" id="boardFrame">
      <div class="board-notice">こちらからゾンビが来ます ▼</div>
      <div id="mainGrid"></div>
    </div>
  </div>

  <!-- 右カラム：モンスター選択エリア -->
  <div class="monster-frame" id="monsterFrame">
    <div class="monster-title">モンスター選択</div>

    <details class="filter-details">
      <summary class="filter-summary">
        <span>絞り込みフィルターを開く</span>
        <span class="summary-arrow">▼</span>
      </summary>
      
      <div class="filter-section">
        <div class="filter-row" id="attrFilterGroup">
          <span class="filter-label">属性:</span>
          <button class="filter-btn active" data-attr="all">すべて</button>
          <button class="filter-btn" data-attr="水">水</button>
          <button class="filter-btn" data-attr="炎">炎</button>
          <button class="filter-btn" data-attr="草">草</button>
          <button class="filter-btn" data-attr="岩">岩</button>
          <button class="filter-btn" data-attr="雷">雷</button>
        </div>

        <div class="filter-row" id="typeFilterGroup">
          <span class="filter-label">タイプ:</span>
          <button class="filter-btn active" data-type="all">すべて</button>
          <button class="filter-btn" data-type="タンク">タンク</button>
          <button class="filter-btn" data-type="ファイター">ファイター</button>
          <button class="filter-btn" data-type="ダメージ">ダメージ</button>
          <button class="filter-btn" data-type="ヒール">ヒール</button>
          <button class="filter-btn" data-type="サポート">サポート</button>
          <button class="filter-btn" data-type="スペシャル">スペシャル</button>
        </div>
      </div>
    </details>

    <div class="monster-grid" id="monsterGrid"></div>
  </div>
</div>

<div id="dragGhost" class="drag-ghost"></div>

<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer-menu" id="drawerMenu">
    <div>
      <div class="drawer-title">ステージ選択</div>
      <div class="drawer-item active" id="normalStageBtn">ノーマルステージ (5×5)</div>
      <div class="drawer-item" id="zombieStageBtn">ゾンビラッシュ (6×6)</div>
    </div>
    <div class="drawer-footer" style="margin-top: auto; text-align: center; font-size: 10px; color: #475569;">by ぱんだ</div>
  </div>
</div>

<script src="monsters.js"></script>

<script>
  const allMonsters = rawMonstersData.map(m => ({
    name: m.name,
    species: m.species,
    attr: m.type,
    tier: "T" + m.T,
    tierNum: m.T,
    type: m.role
  }));

  const speciesTiersMap = {};
  allMonsters.forEach(m => {
    if (!speciesTiersMap[m.species]) speciesTiersMap[m.species] = [];
    if (!speciesTiersMap[m.species].includes(m.tierNum)) {
      speciesTiersMap[m.species].push(m.tierNum);
    }
  });
  Object.keys(speciesTiersMap).forEach(species => {
    speciesTiersMap[species].sort((a, b) => a - b);
  });

  const baseMonstersMap = new Map();
  allMonsters.forEach(m => {
    if (!baseMonstersMap.has(m.species) || m.tierNum < baseMonstersMap.get(m.species).tierNum) {
      baseMonstersMap.set(m.species, m);
    }
  });
  const monstersData = Array.from(baseMonstersMap.values());

  let currentSelected = null;
  let currentAttr = "all";
  let currentType = "all";
  let currentGridSize = parseInt(localStorage.getItem('monsterBoard_size')) || 5;
  let currentPlayer = "1P";

  let draggingItem = null;
  const dragGhost = document.getElementById('dragGhost');
  const mainGrid = document.getElementById('mainGrid');
  const monsterFrame = document.getElementById('monsterFrame');
  const playerSwitchContainer = document.getElementById('playerSwitchContainer');
  const btn1P = document.getElementById('btn1P');
  const btn2P = document.getElementById('btn2P');
  const normalStageBtn = document.getElementById('normalStageBtn');
  const zombieStageBtn = document.getElementById('zombieStageBtn');
  const selectedNameEl = document.getElementById('selectedName');

  function saveBoardState() {
    const cellsData = [];
    document.querySelectorAll('#mainGrid .cell').forEach((cell, index) => {
      const img = cell.querySelector('img');
      if (img) {
        cellsData.push({
          index: index,
          src: img.src,
          species: img.dataset.species,
          tier: img.dataset.tier,
          player: img.dataset.player,
          className: cell.className
        });
      }
    });
    localStorage.setItem('monsterBoard_size', currentGridSize);
    localStorage.setItem('monsterBoard_cells', JSON.stringify(cellsData));
  }

  function loadBoardState() {
    const savedCells = JSON.parse(localStorage.getItem('monsterBoard_cells') || '[]');
    savedCells.forEach(data => {
      const cell = mainGrid.children[data.index];
      if (cell) fillCellWithMonster(cell, data);
    });
  }

  function fillCellWithMonster(cell, data) {
    cell.className = data.className;
    cell.innerHTML = `
      <img src="${data.src}" 
           alt="" 
           data-species="${data.species}" 
           data-tier="${data.tier}"
           data-player="${data.player}"
           draggable="false">
    `;

    const img = cell.querySelector('img');
    img.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (e.button !== 0 && e.pointerType === 'mouse') return;

      const startX = e.clientX;
      const startY = e.clientY;
      let isDragging = false;
      const sourceIndex = Array.from(mainGrid.children).indexOf(cell);

      function onMove(moveEvent) {
        const dx = moveEvent.clientX - startX;
        const dy = moveEvent.clientY - startY;
        if (!isDragging && Math.hypot(dx, dy) > 5) {
          isDragging = true;
          draggingItem = {
            type: 'board',
            src: img.src,
            species: img.dataset.species,
            tier: img.dataset.tier,
            player: img.dataset.player,
            sourceIndex: sourceIndex,
            sourceClassName: cell.className
          };
          dragGhost.style.backgroundImage = `url(${img.src})`;
          dragGhost.style.display = 'block';
          updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
          cell.innerHTML = '';
          cell.className = 'cell';
        }
        if (isDragging) updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
      }

      function onUp(upEvent) {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        if (!isDragging) {
          cell.innerHTML = '';
          cell.className = 'cell';
          saveBoardState();
          return;
        }
        dragGhost.style.display = 'none';
        const dropTarget = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
        const targetCell = dropTarget ? dropTarget.closest('.cell') : null;
        
        if (dropTarget && monsterFrame.contains(dropTarget)) {
          draggingItem = null;
          saveBoardState();
          return;
        }
        if (!targetCell || !mainGrid.contains(targetCell)) {
          revertToSourceCell();
          return;
        }

        const targetIndex = Array.from(mainGrid.children).indexOf(targetCell);
        const existingImg = targetCell.querySelector('img');
        const targetSpecies = draggingItem.species;

        let isSpeciesOnBoard = false;
        Array.from(mainGrid.children).forEach((c, idx) => {
          if (idx === targetIndex) return;
          const im = c.querySelector('img');
          if (im && im.dataset.species === targetSpecies) {
            if (currentGridSize === 5 || im.dataset.player === draggingItem.player) isSpeciesOnBoard = true;
          }
        });

        if (isSpeciesOnBoard) {
          alert('同じ種族のモンスターは既に配置されています。');
          revertToSourceCell();
          return;
        }
        if (existingImg && !(existingImg.dataset.species === targetSpecies && (currentGridSize === 5 || existingImg.dataset.player === draggingItem.player))) {
          alert('すでにモンスターが配置されています。');
          revertToSourceCell();
          return;
        }

        targetCell.className = 'cell ' + (currentGridSize === 6 ? (draggingItem.player === '1P' ? 'p1-cell' : 'p2-cell') : '');
        fillCellWithMonster(targetCell, {
          src: draggingItem.src,
          species: draggingItem.species,
          tier: draggingItem.tier,
          player: draggingItem.player,
          className: targetCell.className
        });
        draggingItem = null;
        saveBoardState();
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  function updateGhostPosition(x, y) {
    dragGhost.style.left = `${x - 25}px`;
    dragGhost.style.top = `${y - 25}px`;
  }

  function revertToSourceCell() {
    if (!draggingItem || draggingItem.type !== 'board') return;
    const cells = Array.from(mainGrid.children);
    const sourceCell = cells[draggingItem.sourceIndex];
    if (sourceCell) {
      fillCellWithMonster(sourceCell, {
        src: draggingItem.src,
        species: draggingItem.species,
        tier: draggingItem.tier,
        player: draggingItem.player,
        className: draggingItem.sourceClassName
      });
    }
    draggingItem = null;
  }

  function buildBoard(size) {
    currentGridSize = size;
    mainGrid.className = `grid-${size}x${size}`;
    if (size === 6) {
      playerSwitchContainer.classList.add('show');
      zombieStageBtn.classList.add('active');
      normalStageBtn.classList.remove('active');
    } else {
      playerSwitchContainer.classList.remove('show');
      normalStageBtn.classList.add('active');
      zombieStageBtn.classList.remove('active');
      currentPlayer = "1P";
    }
    mainGrid.innerHTML = '';
    for (let i = 0; i < size * size; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!currentSelected) {
          cell.innerHTML = '';
          cell.className = 'cell';
          saveBoardState();
          return;
        }
        // ここに配置ロジック
        const targetSpecies = currentSelected.species;
        let isSpeciesOnBoard = false;
        document.querySelectorAll('#mainGrid .cell').forEach(c => {
          const im = c.querySelector('img');
          if (im && im.dataset.species === targetSpecies) {
            if (currentGridSize === 5 || im.dataset.player === currentPlayer) {
              if (c !== cell) isSpeciesOnBoard = true;
            }
          }
        });
        if (isSpeciesOnBoard) { alert('同じ種族のモンスターは既に盤面に配置されています。'); return; }
        
        fillCellWithMonster(cell, {
          src: currentSelected.imgUrl,
          species: targetSpecies,
          tier: currentSelected.tierNum,
          player: currentGridSize === 6 ? currentPlayer : '1P',
          className: 'cell ' + (currentGridSize === 6 ? (currentPlayer === '1P' ? 'p1-cell' : 'p2-cell') : '')
        });
        currentSelected = null;
        selectedNameEl.textContent = 'なし';
        saveBoardState();
        renderMonsters();
      });
      mainGrid.appendChild(cell);
    }
    loadBoardState();
  }

  const monsterGrid = document.getElementById('monsterGrid');
  function renderMonsters() {
    monsterGrid.innerHTML = '';
    const filtered = monstersData.filter(m => (currentAttr === 'all' || m.attr === currentAttr) && (currentType === 'all' || m.type === currentType));

    filtered.forEach(baseM => {
      const species = baseM.species;
      const item = document.createElement('div');
      item.className = 'monster-item' + (currentSelected && currentSelected.species === species ? ' active' : '');
      item.dataset.attr = baseM.attr;
      const displayM = (currentSelected && currentSelected.species === species) ? 
                       allMonsters.find(m => m.species === species && m.tierNum === currentSelected.tierNum) : baseM;

      item.innerHTML = `
        <img class="monster-type-icon" src="${baseM.type}.webp" onerror="this.style.display='none'">
        <img class="monster-thumb" src="${displayM.name}.webp" onerror="this.src='${displayM.name}.png'">
        <div class="monster-name">${displayM.name}</div>
      `;

      item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        const startX = e.clientX;
        const startY = e.clientY;
        let isDragging = false;

        // 【修正済】ドラッグ開始時のデータ設定
        let dragData;
        if (currentSelected && currentSelected.species === species) {
          dragData = { species: currentSelected.species, tier: currentSelected.tierNum, imgUrl: currentSelected.imgUrl };
        } else {
          const minTier = speciesTiersMap[species][0];
          const t1Monster = allMonsters.find(m => m.species === species && m.tierNum === minTier) || baseM;
          dragData = { species: species, tier: minTier, imgUrl: `${t1Monster.name}.webp` };
        }

        function onMove(moveEvent) {
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (!isDragging && Math.hypot(dx, dy) > 5) {
            isDragging = true;
            draggingItem = { type: 'palette', src: dragData.imgUrl, species: dragData.species, tier: dragData.tier, player: currentGridSize === 6 ? currentPlayer : '1P' };
            dragGhost.style.backgroundImage = `url(${dragData.imgUrl})`;
            dragGhost.style.display = 'block';
            updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
          }
          if (isDragging) updateGhostPosition(moveEvent.clientX, moveEvent.clientY);
        }

        function onUp(upEvent) {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          if (!isDragging) {
            if (currentSelected && currentSelected.species === species) {
              const tiers = speciesTiersMap[species];
              const idx = tiers.indexOf(currentSelected.tierNum);
              if (idx < tiers.length - 1) {
                currentSelected.tierNum = tiers[idx + 1];
                currentSelected.name = allMonsters.find(m => m.species === species && m.tierNum === currentSelected.tierNum).name;
                currentSelected.imgUrl = `${currentSelected.name}.webp`;
              } else { currentSelected = null; }
            } else { currentSelected = { species, tierNum: speciesTiersMap[species][0], name: baseM.name, imgUrl: `${baseM.name}.webp` }; }
            renderMonsters();
            selectedNameEl.textContent = currentSelected ? `${currentSelected.name} (T${currentSelected.tierNum})` : 'なし';
            return;
          }
          dragGhost.style.display = 'none';
          const dropTarget = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
          const targetCell = dropTarget ? dropTarget.closest('.cell') : null;
          if (targetCell && mainGrid.contains(targetCell)) {
             // 配置ロジック(簡略版)
             fillCellWithMonster(targetCell, { src: draggingItem.src, species: draggingItem.species, tier: draggingItem.tier, player: draggingItem.player, className: 'cell ' + (currentGridSize === 6 ? (draggingItem.player === '1P' ? 'p1-cell' : 'p2-cell') : '') });
             saveBoardState();
          }
          draggingItem = null;
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
      monsterGrid.appendChild(item);
    });
  }

  document.getElementById('appContainer').addEventListener('click', (e) => {
    if (!e.target.closest('.cell') && !e.target.closest('.monster-item')) {
      currentSelected = null;
      selectedNameEl.textContent = 'なし';
      renderMonsters();
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('.cell').forEach(c => { c.innerHTML = ''; c.className = 'cell'; });
    localStorage.removeItem('monsterBoard_cells');
  });

  buildBoard(currentGridSize);
  renderMonsters();
</script>
</body>
</html>
