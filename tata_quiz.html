<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスターサバイバル：タタのシュール生態クイズ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
        }
        .start-screen {
            display: none;
        }
        .start-screen.active {
            display: block;
        }
        .top-image {
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .top-image:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
        }
        .start-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .quiz-box {
            display: none;
            text-align: left;
        }
        .quiz-box.active {
            display: block;
        }
        .progress {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: var(--primary);
        }
        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: #34d399;
        }
        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: #f87171;
        }
        .explanation {
            background-color: #0f172a;
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }
        .next-btn, .restart-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }
        .next-btn:hover, .restart-btn:hover {
            background-color: var(--primary-hover);
        }
        .result-screen {
            text-align: center;
            display: none;
        }
        .result-screen.active {
            display: block;
        }
        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- スタート画面（ご提示いただいた画像をトップに配置） -->
        <div id="startScreen" class="start-screen active">
            <img src="タタクイズ.webp" alt="タタクイズ" class="top-image" onclick="startQuiz()" title="クリックしてスタート！">
            <p class="start-desc">
                タタたちの図鑑説明に隠されたシュールで笑える生態から全10問が出題されます。画像をタップしてクイズを始めよう！
            </p>
        </div>

        <!-- クイズ画面 -->
        <div id="quizScreen" class="quiz-box">
            <div class="progress" id="progressText">第 1 問 / 全 10 問</div>
            <div class="question-text" id="questionText">問題文がここに表示されます</div>
            <div class="options" id="optionsContainer"></div>
            <div class="explanation" id="explanationText">解説がここに表示されます</div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
        </div>

        <!-- 結果画面 -->
        <div id="resultScreen" class="result-screen">
            <h2>クイズ終了！</h2>
            <p style="color: var(--text-muted);">あなたの正解数は...</p>
            <div class="score-display" id="scoreDisplay">0 / 10</div>
            <p id="commentDisplay" style="margin-bottom: 25px; line-height: 1.5;"></p>
            <button class="restart-btn" style="display: block;" onclick="startQuiz()">もう一度挑戦する</button>
        </div>
    </div>

    <!-- 別名で切り離したデータファイルを読み込む -->
    <script src="tata_quiz_data.js"></script>
    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz() {
            const count = Math.min(10, allQuestions.length);
            currentQuestions = shuffle([...allQuestions]).slice(0, count);
            currentIndex = 0;
            score = 0;

            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');

            showQuestion();
        }

        function showQuestion() {
            const qData = currentQuestions[currentIndex];
            document.getElementById('progressText').innerText = `第 ${currentIndex + 1} 問 / 全 ${currentQuestions.length} 問`;
            document.getElementById('questionText').innerText = qData.q;

            let optionsWithIndex = qData.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
            optionsWithIndex = shuffle(optionsWithIndex);

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            optionsWithIndex.forEach((optObj) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optObj.text;
                btn.onclick = () => selectOption(optObj.originalIdx, qData.correct, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanationText').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectOption(selectedIdx, correctIdx, clickedBtn) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIdx === correctIdx) {
                clickedBtn.classList.add('correct');
                score++;
            } else {
                clickedBtn.classList.add('incorrect');
            }

            const qData = currentQuestions[currentIndex];
            buttons.forEach(btn => {
                if (btn.innerText === qData.options[qData.correct]) {
                    btn.classList.add('correct');
                }
            });

            const expDiv = document.getElementById('explanationText');
            expDiv.innerText = qData.explanation;
            expDiv.style.display = 'block';

            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            document.getElementById('scoreDisplay').innerText = `${score} / ${currentQuestions.length}`;

            let comment = "";
            if (score === currentQuestions.length) {
                comment = "全問パーフェクトです！あなたこそ真のタタ博士、究極のマスターテイマーですね！";
            } else if (score >= 7) {
                comment = "お見事！タタたちのシュールな生態をかなり深く理解していますね！";
            } else {
                comment = "もう少しでタタたちの奇妙な世界を理解できそう！何度でも遊んでマスターしよう！";
            }
            document.getElementById('commentDisplay').innerText = comment;
        }
    </script>
</body>
</html>
