<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ティアリスト作成ツール</title>
  <link rel="stylesheet" href="./tierlist.css">
  <!-- html2canvas（画像保存用ライブラリ） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- 既存のhtml2canvasの下あたりにこれを追記 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- Discord用OGP設定 -->
  <meta property="og:title" content="ティアリスト作成ツール" />
  <meta property="og:description" content="自分だけのティアリストを作って共有しよう！" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>

  <div class="tier-container">
    <header class="header-tools">
      <div class="title-area">
        <a href="./index.html" class="btn btn-back">← 配置ツールへ戻る</a>
        <h1>ティアリスト作成ツール</h1>
      </div>
      <div class="btn-group">
        <button id="addRowBtn" class="btn btn-add">＋ 行を追加</button>
        <button id="shareBtn" class="btn btn-share" style="background-color: #4CAF50; color: #fff;">共有リンクを作成</button>
        <button id="resetBtn" class="btn btn-reset">リセット</button>
        <button id="saveImgBtn" class="btn btn-save">画像として保存</button>
      </div>
    </header>

    <!-- 画像保存対象ラッパー -->
    <div id="tierTableArea" class="tier-table-wrapper">
      <!-- 編集可能なタイトルヘッダー -->
      <div class="tier-table-title-container">
        <input type="text" id="tierTableTitle" class="tier-table-title" value="○○ティア表" placeholder="タイトルを入力" spellcheck="false" />
      </div>

      <!-- ティア表本体 -->
      <div id="tierTable" class="tier-table">
        <!-- 行はJavaScriptから自動生成されます -->
      </div>
    </div>

    <!-- 未配置のモンスタープール -->
    <div class="pool-section">
      <h2>未配置のタタ</h2>
      <div id="monsterPool" class="tier-dropzone pool-dropzone"></div>
    </div>
  </div>

  <!-- ドラッグ中のゴースト表示 -->
  <div id="dragGhost" class="drag-ghost"></div>

  <!-- スクリプト読み込み -->
  <script src="./monsters.js"></script>
  <script src="./tierlist.js"></script>
</body>
</html>
